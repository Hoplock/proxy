openapi: 3.0.3

info:
  title: Hoplock Proxy Control API
  description: |
    The contract between a **proxy** (Policy Enforcement Point) and the
    **Hoplock Control** (Policy Decision Point).

    The proxy originates no policy (PLAN D2): it authenticates nothing
    locally, decides no routes, and invents no filter lists. It does not,
    however, re-ask per action — `/v1/authorize` returns the whole policy for a
    connection (route, channel allow-list, filter policy), which the proxy
    then enforces locally for that connection's lifetime. The round trips are at
    session setup; the session's data path makes no calls to this API.

    All requests are JSON over HTTPS (PLAN D9). The proxy authenticates itself
    to Hoplock Control with a bearer token (see `proxyToken`); that is a
    deliberate seam — production deployments are expected to replace it with
    mTLS or a signed assertion without changing the payloads.

    A `401` from any endpoint is a **decision**, not a failure: it means "deny
    this user/session". Transport failures and `5xx` responses are separate and
    must never be interpreted as a deny.

    ## Policy vocabulary v2 (phase 0006)

    The endpoints and their semantics are unchanged, so the path prefix stays
    `/v1`. What changed is the **vocabulary** `/v1/authorize` answers in: the
    flat `permitted_channels` list is joined by in-channel request policy,
    forwarding destinations, connection-level global requests, a server-chosen
    target credential method, a hop connection direction, and an exec
    enforcement mode (PLAN D5a, D6a, D11, D12).

    Every one of those fields is **additive with a documented absent-value
    default**, and each default is the behaviour a v1 server already produced,
    so a v2 proxy works unchanged against a v1 server. The defaults are stated
    per field below; none of them is "deny everything", and none of them is
    invented by the proxy.

    Compatibility runs the other way too, and it does **not** rely on ignoring
    what is not understood. A proxy declares the highest vocabulary it
    implements in `AuthorizeRequest.policy_version`; the server MUST NOT answer
    with policy fields introduced after that version, and a proxy that receives
    an authorize field it does not know **fails the session closed** as a
    contract violation rather than dropping the field. Silently ignoring an
    unknown field is how a restriction becomes an allowance, so it is forbidden
    even though it would be the more forgiving behaviour.

    One breaking rename lands with this vocabulary, deliberately batched into
    the change that was breaking anyway (PLAN §11): `ConnMeta.bastion_id` is
    now `proxy_id`, and `GET /v1/bastions/{bastion_id}/events` is now
    `GET /v1/proxies/{proxy_id}/events`.

    ## Policy vocabulary v3 (phase 0013)

    Again the endpoints are untouched. What v3 adds is the vocabulary for
    reaching an estate the proxy cannot administer as a POSIX host (PLAN D13,
    D14):

    - `target_auth_ladder` — an **ordered** list of credential methods the
      proxy walks top-down, replacing the single `target_auth` object. Both
      present is refused; absent still means "use local config"; an empty
      ladder is a **denial**.
    - the `ephemeral-account` method and its device-driver parameters —
      `platform`, `credential_kind`, `expiry_posture`, `lifetime_seconds`.
    - `algorithm_profile` — a per-route, server-named preset for the legs whose
      devices speak nothing a modern default enables.
    - `username` becomes **required** on every provisioning method
      (`ephemeral-user`, `ephemeral-account`, `static-key`). This is the one
      break in v3, and it is deliberate: the parameter used to default to the
      identity's `login`, a client-typed string that must never be the basis of
      an authorization decision.

    `policy_version` is therefore `3`. Every other v3 field is additive with a
    documented absent-value default, and each default is the behaviour a v2
    server already produced.

    ## Policy vocabulary v4 (phase 0018)

    v2 and v3 said WHAT a session may do. v4 says **where that is enforced**,
    and bounds how long and on what grounds the session exists at all (PLAN
    D12 as amended, D16, §6.5).

    - `enforcement` — a rung on each of **two axes**: what the session may
      execute, and what it may reach. The two are separate questions with
      separate mechanisms, and a route may stand on a different rung of each.
      Rungs are named after what they **guarantee**, never after their
      mechanism. A rung the proxy cannot provide is an outage-class denial, and
      never a silent downgrade.
    - **Applied and attested rungs are different kinds.** An *applied* rung is
      one the proxy configures per session and tears down; an *attested* one is
      already enforced by the target, configured by somebody who is not this
      product, and the proxy configures nothing. Attested rungs are how the
      appliance estate carries a real enforcement claim, and they are the only
      kind a `brokered-key` route can carry.
    - `session_deadline`, `require_session_capture`, `grant_context`,
      `concurrency` — the bounds D16 asks for. They are not enforcement points;
      they ride this revision because they are fields on the same object, and
      splitting them into a fifth contract bump would cost Control a third sync
      for no gain.
    - `AuthorizeRequest.capabilities` plus `POST /v1/capabilities/report` — what
      a proxy build can provide, and what one target can take. A server cannot
      sensibly choose a rung that cannot be provided, and what is available
      depends on the target far more than on the proxy.

    `policy_version` is therefore `4`. Every v4 field is additive with a
    documented absent-value default, and each default is exactly the behaviour
    a v3 server already produced: proxy-side enforcement only, no deadline, no
    required capture, no grant context, and no concurrency cap.
  version: 4.0.0
  license:
    name: LicenseRef-Proprietary — all rights reserved

servers:
  - url: https://control.example.com
    description: Hoplock Control root; all paths below are absolute from here.

security:
  - proxyToken: []

tags:
  - name: authentication
    description: user → proxy authentication, delegated to the server.
  - name: authorization
    description: authorize + route decisions.
  - name: host-keys
    description: target host-key reporting (TOFU-with-report, D7).
  - name: logs
    description: session log ingestion (D8).
  - name: revocation
    description: server → proxy revocation stream (PLAN §6.4).
  - name: capabilities
    description: what a target can enforce, discovered by the proxy (contract v4).

paths:
  /v1/auth/cert:
    post:
      tags: [authentication]
      operationId: authenticateCert
      summary: Authenticate a client that offered a public key or certificate.
      description: |
        Called when the SSH client offers a public key or certificate. The
        proxy has already stripped the target segment from the SSH username
        (D1) and sends the bare `login`.

        The proxy performs no local key validation: it relays the offered key
        material and the server decides.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticateCertRequest'
      responses:
        '200':
          description: |
            The key is accepted. `status` is `authenticated` and `identity` is
            present. Certificate authentication never returns `mfa_required`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/auth/password:
    post:
      tags: [authentication]
      operationId: authenticatePassword
      summary: Authenticate a password, optionally starting out-of-band MFA.
      description: |
        Called for password / keyboard-interactive flows, which the proxy
        attempts only after certificate authentication was not accepted.

        MFA is entirely the server's concern. If the server requires a second
        factor it returns `200` with `status: mfa_required` and an
        `mfa` challenge; the proxy then polls `/v1/auth/mfa/poll` until the
        challenge resolves. The proxy never contacts the MFA provider itself.

        The submitted password MUST NOT be logged by either side (PLAN §7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticatePasswordRequest'
      responses:
        '200':
          description: |
            The password was accepted. Either `status` is `authenticated` and
            `identity` is present, or `status` is `mfa_required` and `mfa`
            carries the challenge to poll.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/auth/mfa/poll:
    post:
      tags: [authentication]
      operationId: pollMFA
      summary: Poll an outstanding out-of-band MFA challenge.
      description: |
        Polled by the proxy after `/v1/auth/password` returned
        `status: mfa_required`, no more often than the challenge's
        `poll_after_ms`.

        While the user has not answered, the server repeats `200` with
        `status: mfa_required` and a refreshed `mfa` challenge (the token stays
        valid until `expires_at`). Approval returns `status: authenticated` with
        the identity; denial, expiry, or an unknown token return `401`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAPollRequest'
      responses:
        '200':
          description: The challenge is either still pending or has been approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/authorize:
    post:
      tags: [authorization]
      operationId: authorize
      summary: Authorize an authenticated identity for a target and return a route.
      description: |
        The single decision that shapes the whole session (PLAN §1 step 4). The
        response tells the proxy where to connect (`direct` to the target, or
        `nexthop` to another proxy), which SSH channel types it may open, and
        which command filter policy to enforce.

        The proxy MUST treat the response as the complete policy for the
        connection: anything not permitted here is denied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeRequest'
      responses:
        '200':
          description: Access is granted; the body is the route and policy to enforce.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/hostkeys/report:
    post:
      tags: [host-keys]
      operationId: reportHostKey
      summary: Report a target host key and get the trust decision for it.
      description: |
        Called before the proxy completes the target handshake, for every
        target host key it sees. In the prototype the server implements
        trust-on-first-use and records the key (D7); the response still carries
        an explicit decision so a later, stricter policy needs no proxy change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostKeyReportRequest'
      responses:
        '200':
          description: The report was recorded; `decision` says whether to proceed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostKeyReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/capabilities/report:
    post:
      tags: [capabilities]
      operationId: reportCapabilities
      summary: Report the enforcement rungs one target can take.
      description: |
        Called once the proxy has probed a target it just logged into
        (contract v4, phase 0019). The server accumulates the reports and uses
        them to constrain what a policy author may choose per route: it cannot
        sensibly select an enforcement rung the target cannot take, and the
        proxy is the only party positioned to find that out, because it is the
        only one that logs in.

        It takes the shape of `/v1/hostkeys/report` (D7) for the same reason:
        `/v1/authorize` happens **before** the proxy has ever touched the
        target, so a first-ever connection has nothing to put on
        `AuthorizeRequest`.

        **A report is an observation and grants nothing.** The authority for a
        rung is the authorize response; this record only stops a server
        choosing one that cannot be provided. That is what makes a stale or
        absent record safe: the proxy re-checks the rung against the live
        target at provisioning time and fails the session as an outage if it
        cannot provide it (PLAN §4.3). The worst a stale record can cause is a
        refused session — never a session running below the rung its own audit
        record claims.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityReportRequest'
      responses:
        '200':
          description: The report was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/logs/batch:
    post:
      tags: [logs]
      operationId: ingestLogBatch
      summary: Ingest a batch of session log records.
      description: |
        The throughput path (D8). The proxy accumulates records and ships them
        in batches; the server acknowledges how many it accepted. Batches are
        the default for everything that is not a critical security event.

        Records carry a client-assigned `record_id` so a retried batch (after a
        timeout or a drained disk buffer) can be de-duplicated by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogBatchRequest'
      responses:
        '202':
          description: The batch was accepted for storage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/logs/priority:
    post:
      tags: [logs]
      operationId: ingestPriorityLog
      summary: Ingest a single critical record immediately.
      description: |
        The low-latency path for blocked commands and other critical security
        events (D8). It is a **separate endpoint**, not a flag on
        `/v1/logs/batch`, so that a priority event is never queued behind a
        large batch, can use its own timeout and connection, and is easy to
        prioritise separately in the server and in any middlebox.

        Unlike the batch endpoint this responds `200`: the acknowledgement means
        the record is durable, so the proxy can act (e.g. kill the session)
        knowing the event was recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogPriorityRequest'
      responses:
        '200':
          description: The record is durable on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogPriorityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/proxies/{proxy_id}/events:
    get:
      tags: [revocation]
      operationId: streamProxyEvents
      summary: Subscribe to the proxy's revocation event stream.
      description: |
        A long-lived response of **newline-delimited JSON**: one
        `RevocationEvent` per line, written as the server decides them, until
        either side closes the connection.

        The subscription is **outbound from the proxy**, and deliberately so:
        proxies sit behind firewalls and must not need an inbound listener
        (PLAN §1). This stream is therefore the server's only way to reach a
        running proxy — to end a session that is already in flight, or to
        withdraw an authorize decision the proxy is allowed to reuse
        (`AuthorizeResponse.cache`). Caching without it would let a revoked
        allow survive for the length of its TTL, so a server that issues cache
        hints MUST serve this endpoint.

        The proxy keeps one subscription open per proxy id and reconnects
        with bounded exponential backoff. A stream that goes silent is
        indistinguishable from a healthy idle one, so the server MUST emit
        `heartbeat` events at a steady interval (comfortably inside the
        proxy's timeout, which defaults to 20s); a proxy that misses them
        drops the connection and reconnects. While the proxy cannot hear this
        stream it stops serving cached decisions and re-authorizes every
        connection — it does **not** kill live sessions.

        **Gap recovery.** On reconnect the proxy sends the last `event_id` it
        processed as `last_event_id`. **The server decides** what happens next:
        it either replays every event after that id, in order, before resuming
        live delivery, or — when the id is too old to replay, unknown, or the
        server keeps no history — it emits a `resync` event as the **first**
        line of the stream and nothing older. `resync` tells the proxy it has
        missed events it cannot be given, so it drops its entire decision cache
        and re-authorizes from scratch. An absent `last_event_id` means a fresh
        subscription: the server starts from now and replays nothing.
      parameters:
        - name: proxy_id
          in: path
          required: true
          description: The proxy whose events are being subscribed to.
          schema:
            type: string
          example: proxy-eu-west-1
        - name: last_event_id
          in: query
          required: false
          description: |
            The last `event_id` the proxy processed. Absent on a fresh
            subscription. It is opaque to the proxy, which only echoes it
            back.
          schema:
            type: string
      responses:
        '200':
          description: |
            The stream is open. The body is newline-delimited `RevocationEvent`
            objects and does not end until the connection does.
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/RevocationEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    proxyToken:
      type: http
      scheme: bearer
      description: |
        Bearer token identifying the proxy to Hoplock Control. This is
        the proxy→server channel credential and is unrelated to the end user's
        SSH credentials.

  responses:
    BadRequest:
      description: The request body was malformed or failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: |
        Deny decision. For the auth endpoints the credential was rejected; for
        `/v1/authorize` the identity may not reach the requested target; for the
        remaining endpoints the proxy's own token was rejected. Clients MUST
        distinguish this from transport errors and never fail open.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: The server failed to process an otherwise valid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code, e.g. `unauthorized`.
              example: unauthorized
            message:
              type: string
              description: Human-readable detail. MUST NOT contain credentials.
              example: no identity matches the offered key

    ConnMeta:
      type: object
      description: |
        Metadata about the SSH connection a request is made on behalf of. Sent
        with every call so the server can make decisions on, and correlate logs
        by, the connection rather than just the identity.
      required: [session_id, proxy_id, client_addr, timestamp]
      properties:
        session_id:
          type: string
          description: Proxy-assigned id, stable for the whole session.
          example: 01HQ2Z3K4M5N6P7Q8R9S0T1V2W
        proxy_id:
          type: string
          description: Identifier of the proxy making the call.
          example: proxy-eu-west-1
        client_addr:
          type: string
          description: Remote address of the SSH client, `host:port`.
          example: 203.0.113.7:52344
        server_addr:
          type: string
          description: Local address the client connected to, `host:port`.
          example: 10.0.0.5:2222
        client_version:
          type: string
          description: SSH client identification string, as offered.
          example: SSH-2.0-OpenSSH_9.6
        hop_trail:
          type: array
          description: |
            Proxy ids already traversed, oldest first, for loop detection on
            next-hop routes (PLAN §6.1). Empty on a user's first hop.
          items:
            type: string
        timestamp:
          type: string
          format: date-time
          description: When the proxy made the call (RFC 3339, UTC).

    Identity:
      type: object
      description: |
        The authenticated principal. Modelled as claims rather than a boolean so
        AD/Okta/OIDC sources can be added without changing any caller (D4).
      required: [subject, login, source]
      properties:
        subject:
          type: string
          description: Stable unique id of the principal at its source.
          example: alice@example.com
        login:
          type: string
          description: The SSH login name, target segment already stripped (D1).
          example: alice
        display_name:
          type: string
          example: Alice Example
        source:
          type: string
          description: |
            Identity source that made the decision, for audit: `fixture` (mock),
            `ad`, `okta`, `oidc`, ...
          example: fixture
        principals:
          type: array
          description: Principals the identity may assume on targets.
          items:
            type: string
        groups:
          type: array
          description: Group memberships used by policy.
          items:
            type: string
        claims:
          type: object
          description: Additional source-specific claims.
          additionalProperties:
            type: string

    PublicKeyMaterial:
      type: object
      description: An SSH public key or certificate as offered on the wire.
      required: [type, blob, fingerprint]
      properties:
        type:
          type: string
          description: SSH key algorithm name.
          example: ssh-ed25519
        blob:
          type: string
          format: byte
          description: Base64 (standard, padded) of the SSH wire encoding.
        fingerprint:
          type: string
          description: OpenSSH-style SHA256 fingerprint of the key.
          example: SHA256:2Fd8mLZ0S7oB0Cq0oQF0T5xN6yQ3wq6Kk1r0m0mHqxU
        is_certificate:
          type: boolean
          description: True when the material is a certificate, not a bare key.
          default: false

    AuthenticateCertRequest:
      type: object
      required: [login, public_key, conn]
      properties:
        login:
          type: string
          description: SSH login, target segment already stripped (D1).
          example: alice
        target:
          type: string
          description: |
            Target parsed from the SSH username, informational at this stage.
            Authorization for it happens at `/v1/authorize`.
          example: host.company.com
        public_key:
          $ref: '#/components/schemas/PublicKeyMaterial'
        conn:
          $ref: '#/components/schemas/ConnMeta'

    AuthenticatePasswordRequest:
      type: object
      required: [login, password, conn]
      properties:
        login:
          type: string
          example: alice
        target:
          type: string
          example: host.company.com
        password:
          type: string
          format: password
          description: |
            The password as typed. MUST NOT be logged, echoed in an error
            message, or stored by either side (PLAN §7 redaction).
        conn:
          $ref: '#/components/schemas/ConnMeta'

    MFAPollRequest:
      type: object
      required: [token, conn]
      properties:
        token:
          type: string
          description: The `mfa.token` from the challenge being polled.
        conn:
          $ref: '#/components/schemas/ConnMeta'

    MFAChallenge:
      type: object
      description: An out-of-band second factor the server is waiting on.
      required: [token, poll_after_ms, expires_at]
      properties:
        token:
          type: string
          description: Opaque handle to poll with; single connection, single use.
        prompt:
          type: string
          description: Text the proxy may show the user while waiting.
          example: Approve the sign-in request on your phone.
        poll_after_ms:
          type: integer
          format: int32
          minimum: 0
          description: Minimum delay before the next poll, in milliseconds.
          example: 1000
        expires_at:
          type: string
          format: date-time
          description: After this instant the token is dead and polling returns 401.

    AuthenticateResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [authenticated, mfa_required]
          description: |
            `authenticated` — `identity` is present and the flow is complete.
            `mfa_required` — `mfa` is present and must be polled.
        identity:
          $ref: '#/components/schemas/Identity'
        mfa:
          $ref: '#/components/schemas/MFAChallenge'

    AuthorizeRequest:
      type: object
      required: [identity, target, conn]
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        target:
          type: string
          description: Target hostname parsed from the SSH username (D1).
          example: host.company.com
        target_port:
          type: integer
          format: int32
          description: Target port if the user requested a non-default one.
          example: 22
        auth_method:
          type: string
          description: How the identity was authenticated, for policy and audit.
          enum: [cert, password-mfa]
        policy_version:
          type: integer
          format: int32
          minimum: 1
          default: 1
          description: |
            The highest **policy vocabulary** version this proxy implements.
            Absent means `1` (the phase 0002/0003 vocabulary: `permitted_channels`
            and `filter_policy.rules` only). Version `2` added the phase 0006
            policy axes; version `3` added the credential ladder, the
            `ephemeral-account` method, and the per-route algorithm profile; the
            current vocabulary is `4`, which added the two enforcement axes and
            the session bounds.

            The server MUST NOT answer with policy fields introduced after this
            version. That constraint is what makes the proxy's fail-closed rule
            safe: because the proxy refuses an authorize response containing a
            field it does not understand, a server that respects
            `policy_version` can add vocabulary freely, and a server that
            ignores it is caught immediately instead of having its restrictions
            silently dropped.
          example: 3
        capabilities:
          $ref: '#/components/schemas/ProxyCapabilities'
        conn:
          $ref: '#/components/schemas/ConnMeta'

    AuthorizeResponse:
      type: object
      required: [route_type, target, permitted_channels, filter_policy]
      properties:
        route_type:
          type: string
          enum: [direct, nexthop]
          description: |
            `direct` — `target` is the end host; the proxy provisions target
            credentials and proxies. `nexthop` — `target` is the next proxy;
            the proxy chains to it and that proxy repeats the flow.
        target:
          type: string
          description: Host to connect to, meaning per `route_type`.
          example: host.company.com
        target_port:
          type: integer
          format: int32
          description: Port to connect to. Defaults to 22 when absent.
          example: 22
        permissions:
          type: string
          description: Opaque permission set name, carried into logs.
          example: readOnlyGroup
        permitted_channels:
          type: array
          description: |
            SSH channel types the session may open, in either direction. The
            proxy denies every channel not on this list (D5). An empty list
            denies all channels.

            This is the coarsest of the three policy axes (D5a) and cannot
            stand alone: `session` carries `scp`, `sftp`, an interactive shell,
            and a one-shot command alike, and a `direct-tcpip` channel's whole
            meaning is the destination in its payload. See
            `permitted_requests` and `permitted_forwards`.
          items:
            type: string
          example: [session, direct-tcpip]
        permitted_requests:
          $ref: '#/components/schemas/RequestPolicy'
        permitted_forwards:
          $ref: '#/components/schemas/ForwardPolicy'
        permitted_global_requests:
          $ref: '#/components/schemas/GlobalRequestPolicy'
        target_auth:
          $ref: '#/components/schemas/TargetAuth'
        target_auth_ladder:
          $ref: '#/components/schemas/TargetAuthLadder'
        algorithm_profile:
          type: string
          enum: [default, legacy-rsa-sha1, legacy-device]
          description: |
            Which SSH algorithm set the proxy may offer on the **proxy→target**
            leg for this route (contract v3, applied by phase 0014).

            Much of the estate `ephemeral-account` exists to reach speaks key
            exchanges, host-key algorithms, ciphers, and MACs that a modern SSH
            library does not enable by default, and without a way to say so
            those routes simply do not connect.

            Two properties make that safe, and it needs both. The profile is
            **named by the server, per route** — never a proxy-wide config
            knob, which would weaken every leg in the fleet to serve the oldest
            device on it. And it is a **named preset**, not an algorithm list,
            so it cannot be widened one algorithm at a time by someone who does
            not know what they are enabling, and the audit record names
            something a reviewer understands.

            - `default` — nothing beyond the library defaults. **Absent ⇒
              `default`**, and it is the only profile that is not a weakening.
            - `legacy-rsa-sha1` — additionally offers RSA with SHA-1 signatures
              (`ssh-rsa`) for host keys and public-key authentication. Separate
              from the profile below so a route needing only this does not also
              get CBC and SHA-1 key exchange.
            - `legacy-device` — `legacy-rsa-sha1` plus the SHA-1 key exchanges,
              CBC ciphers, and SHA-1 MACs that appliance firmware of that era
              offers.

            Anything other than `default` is a **weakening and emits its own
            audit event** (`algorithm_profile` in the record), on D14's sibling
            rule for credential methods: an operator learns that a route runs on
            SHA-1 from the record, not by reading policy. An unknown profile is
            refused rather than coerced — coercing to `default` would deny every
            route on the estate this exists for, and coercing to the widest
            would weaken a leg nobody asked to weaken.
        filter_policy:
          $ref: '#/components/schemas/FilterPolicy'
        enforcement:
          $ref: '#/components/schemas/EnforcementPolicy'
        session_deadline:
          type: string
          format: date-time
          description: |
            When this session must end, as an **absolute instant** (contract
            v4, D16; enforced locally by phase 0025). **Absent ⇒ no deadline**,
            which is today's behaviour.

            The proxy enforces it **locally**, so it holds when the revocation
            stream is down — which is exactly when an immortal root session is
            least acceptable, and the reason this is not "just use revocation".
            Nothing else expresses it: `cache.ttl_seconds` bounds decision
            *reuse* and `ephemeral-user`'s `lifetime_seconds` bounds the
            *credential*, while an already-open session outlives both.

            It is an instant rather than a duration because a duration
            re-anchors on every hop of a chained route, silently multiplying
            the window. It applies to any route, not only a privileged one.

            Reaching it is **neither a denial nor an outage**: the session is
            closed and the close is explained (PLAN §4.3). What the user is
            told, and whether a warning precedes it, belong to phase 0025.
          example: '2026-09-04T17:30:00Z'
        require_session_capture:
          type: boolean
          default: false
          description: |
            This route may only run if the session is **recorded** (contract
            v4, D16). **Absent ⇒ `false`**, which is today's behaviour: capture
            happens if the proxy is configured for it, and its absence stops
            nothing.

            When `true`, a proxy with no recording path at all refuses the
            session as an **outage** (PLAN §4.3), and the check happens
            **before the target leg is dialled** rather than after. Buffering
            to local disk **counts** as recording — the phase 0011 pipeline's
            disk buffer is a resilience path, not a degraded mode — so the
            refusal triggers only when there is no path at all.

            This is the compensating control that makes D16's
            unbounded-privilege grant defensible: root on a target can disable
            that target's auditing and scrub its traces; it cannot touch a
            session captured in the proxy.
        grant_context:
          $ref: '#/components/schemas/GrantContext'
        concurrency:
          $ref: '#/components/schemas/ConcurrencyLimits'
        hop:
          $ref: '#/components/schemas/HopMetadata'
        decision_id:
          type: string
          description: Server-assigned id for this decision, for audit correlation.
        cache:
          $ref: '#/components/schemas/CacheHint'

    RequestPolicy:
      type: object
      description: |
        Which **in-channel requests** the session may make (D5a axis 2, enforced
        by phase 0009).

        A `session` channel is opened before anyone knows what it is for; the
        request that follows is what makes it an interactive login, a one-shot
        command, or a file transfer. So this is the axis that expresses "may log
        in, may not copy files off the box" and "CI may run commands but never
        gets a PTY" — neither of which a channel-type allow-list can say.

        **Absent object ⇒ in-channel requests are not policed**, which is
        exactly what a v1 server produced and therefore what a v1 server must
        keep producing: a server that never heard of this field must not
        accidentally deny every shell. **Present object ⇒ the request types
        listed are the only ones permitted**; anything absent from it is
        denied, so an empty object `{}` denies every request just as
        `permitted_channels: []` denies every channel. A response that is
        truncated, half-written, or misunderstood therefore fails toward deny
        and never toward allow.

        The list governs only the requests that decide what a channel *is*.
        Ancillary session requests carry no policy of their own and are outside
        it — `window-change`, `signal`, `exit-status`, `exit-signal`, `break`,
        and `eow@openssh.com` are relayed regardless, because denying a
        terminal resize is a broken session, not a policy.
      properties:
        types:
          type: array
          description: |
            Permitted request types. `subsystem` is deliberately **not** a
            member: a subsystem is permitted by name in `subsystems`, so that
            `sftp` can be denied while `shell` stays.

            `auth-agent-req` covers both the bare name and OpenSSH's
            `auth-agent-req@openssh.com`, which are the same request.
          items:
            type: string
            enum: [pty-req, shell, exec, env, x11-req, auth-agent-req]
          example: [pty-req, shell, exec]
        subsystems:
          type: array
          description: |
            Subsystems permitted by name, matched exactly against the
            `subsystem` request's name. Absent or empty denies every subsystem
            while leaving `types` untouched — that is how `sftp` is turned off
            for a route whose shell stays on.
          items:
            type: string
          example: [sftp]

    ForwardPolicy:
      type: object
      description: |
        Which **forwarding destinations** the session may reach (D5a axis 2,
        enforced by phase 0009).

        A `direct-tcpip` channel open carries the host and port it wants in its
        payload, so the destination — not the channel type — is what policy is
        actually about. Permitting or denying `direct-tcpip` wholesale is the
        difference between a toggle and a firewall; this list is the firewall.

        **Absent object ⇒ destinations are not policed**: a route that permits
        the channel type permits any destination on it, which is v1 behaviour.
        **Present object ⇒ only listed destinations are permitted**, per
        direction; a direction whose list is absent or empty is denied
        entirely. A forwarding channel type that is not on
        `permitted_channels` is denied whatever this object says — the two
        axes are conjunctive, never a way to widen each other.
      properties:
        direct_tcpip:
          type: array
          description: |
            Destinations the **client** may open a forward to, matched against
            the `direct-tcpip` channel-open payload's host and port.
          items:
            $ref: '#/components/schemas/ForwardDestination'
        forwarded_tcpip:
          type: array
          description: |
            Destinations the **target** may open a forward back for, matched
            against the `forwarded-tcpip` channel-open payload. It is the same
            channel type in the other direction and needs its own list: a route
            that may tunnel out to the database must not thereby accept
            arbitrary channels pushed the other way.
          items:
            $ref: '#/components/schemas/ForwardDestination'

    ForwardDestination:
      type: object
      description: |
        One permitted forwarding destination: a host pattern and, optionally, a
        port constraint. A channel is permitted when it matches at least one
        entry in the list for its direction.
      required: [host]
      properties:
        host:
          type: string
          description: |
            Host pattern matched against the destination in the channel-open
            payload. Three forms, distinguished by shape:

            - **exact** — `db.prod.company.com`, compared case-insensitively;
            - **wildcard** — a leading `*.` matching one or more leading labels
              (`*.prod.company.com` matches `db.prod.company.com`), or the bare
              `*` matching anything;
            - **CIDR** — `10.4.0.0/16` or `2001:db8::/32`, matched only when
              the payload's host parses as an IP address in that network. A
              CIDR entry never matches a hostname, and a hostname entry never
              matches an IP literal: the proxy does not resolve names to decide
              policy, because a DNS answer is not a decision the PDP made.
          example: db.prod.company.com
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          description: |
            Exact permitted port. Mutually exclusive with `port_range`; setting
            both is a contract violation the proxy refuses. Omitting both
            permits **any** port on a matching host, which is a decision the
            server made explicitly by writing an entry with no port constraint.
          example: 5432
        port_range:
          $ref: '#/components/schemas/PortRange'

    PortRange:
      type: object
      description: An inclusive port range.
      required: [from, to]
      properties:
        from:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          example: 30000
        to:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          description: Inclusive upper bound; must be greater than or equal to `from`.
          example: 30100

    GlobalRequestPolicy:
      type: object
      description: |
        Which **connection-level global requests** the session may make (D5a
        axis 3, enforced by phase 0009).

        Remote forwarding is requested with `tcpip-forward` on the connection,
        not by opening a channel, so it is invisible to a channel-type
        allow-list — and denying the resulting `forwarded-tcpip` channel is not
        equivalent, because the listener is created on the target either way and
        only the connections through it fail. A denied global request is
        answered with a `false` reply rather than relayed.

        **Absent object ⇒ global requests are relayed unpoliced** (v1
        behaviour: `serveGlobalRequests` relays every one). **Present object ⇒
        only the listed types are relayed**; `{}` denies all of them.

        Transport hygiene requests carry no policy and are outside the list:
        `keepalive@openssh.com`, `no-more-sessions@openssh.com`,
        `hostkeys-00@openssh.com`, and `hostkeys-prove-00@openssh.com` are
        relayed regardless. Denying a keepalive breaks a healthy session, and
        `no-more-sessions@openssh.com` is a restriction the client is asking
        for.
      properties:
        types:
          type: array
          description: |
            Permitted global request types, matched exactly against the request
            name on the wire.
          items:
            type: string
          example: [tcpip-forward, cancel-tcpip-forward]

    TargetAuth:
      type: object
      description: |
        How the proxy authenticates to the **target** for this route (D6a,
        consumed by phase 0007).

        The choice belongs to the server, per route, not to proxy-local config:
        one proxy routinely fronts a Linux estate that accepts just-in-time
        provisioning and an appliance estate that can never create a user, and
        `auth.target.method` in `config.yaml` cannot express that. With this
        object, that config key becomes **local material only** — which key,
        which provisioning account — and never the selection.

        **Absent ⇒ the proxy uses its locally configured method**, which is
        what a v1 server implies and how phase 0005 already behaves. A v2
        server should always set it.

        A method the proxy does not implement, or has no local material for, is
        an **outage-class denial** (PLAN §4.3): the session fails and says so.
        It is never a fallback to a different method, which would mean
        connecting with credentials the server did not choose.

        **Contract v3 supersedes this single object with `target_auth_ladder`**
        (D14), an ordered list of exactly these entries. The two are
        alternatives, never layers: a response carrying both is refused. A v2
        server keeps sending this object and it keeps meaning what it meant.
      required: [method]
      properties:
        method:
          type: string
          enum: [ephemeral-user, brokered-key, ephemeral-account, static-key]
          description: |
            `ephemeral-user` — create a short-lived OS user and key on the
            target and remove them afterwards (D6, PLAN §5.1).
            `brokered-key` — use a per-target credential held only for the
            session and never written to disk (PLAN §5.2), for devices the
            proxy cannot administer.
            `ephemeral-account` — create a short-lived administrator on a device
            through a platform driver and remove it afterwards (D13, PLAN §5.3).
            The same lifecycle as `ephemeral-user` in a different vocabulary
            over a different transport: an appliance cannot run `useradd`, but
            it can create an administrator, set its credential, scope it, pin it
            to a source address, and delete it again.
            `static-key` — the development placeholder from phase 0005; it is
            named here so a fixture can select it, and it is not a production
            method.
        params:
          type: object
          additionalProperties:
            type: string
          description: |
            Method-specific parameters. The object is **open on purpose**: a
            future Hoplock Control that mints per-session target credentials
            itself arrives as another `method` plus its own parameters, not as
            another breaking change to this schema.

            Parameter names are scoped to their method. A proxy that implements
            the named method MUST refuse a parameter name it does not know, for
            the same reason it refuses an unknown top-level field: an unknown
            parameter may be a constraint, and dropping a constraint widens
            access.

            **`username` is REQUIRED on every provisioning method** —
            `ephemeral-user`, `ephemeral-account`, and `static-key` alike
            (contract v3). Before v3 it defaulted to the identity's `login`,
            which is a **client-typed string** the proxy must never base an
            authorization decision on; letting it name an OS or device account
            was that rule leaking through the back door. The account name is
            what the target's own audit trail, its file ownership, and — on a
            password credential — half the credential pair are made of, so the
            server names it or there is no route. `brokered-key` is deliberately
            not in that set: it logs into an account that already exists and was
            chosen by an operator.

            Documented parameters today:

            - `ephemeral-user`: `username` (**required**: the OS user to
              create), `key_type` (e.g. `ed25519`; absent leaves the proxy's
              default), `lifetime_seconds` (upper bound on the provisioned
              credential's life; absent leaves it unbounded by the route).
            - `brokered-key`: `username` (the standing account to log in as;
              absent derives it from the identity's login, unchanged from v2)
              and `credential_ref` (an **opaque handle** naming local material
              on the proxy). No credential material travels on this API —
              `credential_ref` selects it, it does not carry it.
            - `ephemeral-account` (D13, PLAN §5.3): `username` (**required**),
              `platform` (**required**: which driver; it is **never inferred**
              from a banner, because guessing wrong means running configuration
              commands against the wrong parser), `credential_kind`
              (**required**: `password` or `publickey`), `expiry_posture`
              (**required**: `target-enforced`, `proxy-enforced`, or
              `accepted-risk`), and `lifetime_seconds` (**required unless the
              posture is `accepted-risk`** — a posture that enforces an expiry
              with no expiry to enforce is a statement with no content).
            - `static-key`: `username` (**required**).

            None of the four `ephemeral-account` parameters has an absent-value
            default, on purpose. `platform` is never guessed. A
            `credential_kind` default would hand out the weaker of two
            materially different exposures — a password is a reusable secret
            that lands in the device's running configuration and often in its
            own logs, a public key is not — to a policy that never said so. And
            "the risk was accepted" is a sentence somebody writes down, never
            one a proxy infers from an omission.

            A **posture or credential kind the driver cannot satisfy is a
            skipped ladder entry** (D14), not a downgrade to the other one: the
            proxy walks on to the next rung and never substitutes. PLAN §5.1's
            rule that a fleet unable to express expiry is refused holds for
            `target-enforced` and only for it.

            An entry the proxy cannot **read** — an unknown method, a malformed
            `platform`, an unknown kind or posture, a missing required
            parameter — is a contract violation that refuses the whole response,
            not a rung to skip. That distinction is what stops a server hiding a
            constraint in an entry the proxy would silently drop. Whether a
            driver for a well-formed `platform` actually exists is not asked
            here: customer-written drivers are a first-class case (D13), so the
            set of platforms is open and an unregistered one is an outage-class
            denial at provisioning time.

            **Platform-specific fields: the `device_field.` namespace**
            (contract v3.1, phase 0016). Some devices are not one target. A
            FortiGate running virtual domains is one unit partitioned into
            many, and an administrator on it is either global or scoped to one
            VDOM; a FortiLink-managed FortiSwitch is administered *through* the
            FortiGate in front of it. A route has to be able to say which of
            them a session is for, and the endpoint cannot say it: `host`/`port`
            is what DNS resolves, what the host key is pinned to, and what the
            audit record names, so overloading it would make one device look
            like several hosts that do not exist.

            So `ephemeral-account` carries an **open namespace of additional
            fields** beside its five parameters. Any parameter named
            `device_field.<name>` is a platform-specific field handed to the
            named driver as data. The contract does not enumerate them and never
            will: customer-written drivers are a first-class case (D13), so the
            set of fields is as open as the set of platforms. What the contract
            checks is the SHAPE only — `<name>` is lowercase letters, digits,
            hyphens and underscores, 64 characters or fewer; the value is
            non-empty and 256 characters or fewer; and there are at most 16 of
            them on one entry.

            A driver **declares** the field names it accepts. A route naming a
            field the driver does not declare is a **skipped ladder entry**
            (D14), on the rule above: an unknown parameter may be a constraint,
            and a proxy that cannot honour one must not connect.

            Fields are policy metadata and never credential material, and they
            are **audit facts**: the account-mapping record carries them,
            because on a partitioned device the target string alone does not say
            which partition an administrator was created in.

            Documented today: **`device_field.vdom`** on a FortiGate — the
            virtual domain a VDOM-scoped administrator is created in. Absent, a
            unit running virtual domains gets a **global** administrator
            instead, and a unit not running them is unaffected (phase 0016,
            PLAN §5.3).

            Values are never logged, never echoed in an error, and never
            written to disk.
          example:
            username: svc-net
            credential_ref: appliance-fleet-2026

    TargetAuthLadder:
      type: array
      description: |
        The **ordered** list of credential methods the server named for this
        route (D14, contract v3, walked by phase 0014).

        The proxy walks it **top-down and uses the first entry it can satisfy**.
        An entry naming a method this build does not implement, or has no local
        material for, or whose driver cannot meet its declared terms, is
        **skipped**; exhausting the ladder is a clean session denial
        (outage-class, PLAN §4.3).

        What has never been permitted, and still is not, is the proxy connecting
        with a method the server did not name. D6a's rule survives D14 untouched
        — what changed is who may author the fallback, not whether one exists. A
        PDP that will not accept degradation on a target writes a **one-entry
        ladder**, which behaves exactly as D6a originally specified.

        Three states, and they are three different policies:

        - **Absent ⇒ the proxy uses its locally configured method** (v1/v2
          behaviour, and what a server that never heard of this field implies).
        - **Present and empty (`[]`) ⇒ a denial.** The server named no method it
          will accept. It is the same absent-versus-empty rule as
          `permitted_channels: []`, and it fails toward deny.
        - **Present and non-empty ⇒ walk it in order.**

        `target_auth` and `target_auth_ladder` are alternatives, never layers:
        a response setting **both is refused** by the proxy, on the same
        reasoning as `restricted_exec` beside a non-empty `rules` list (D12) —
        two statements of which credential to use, disagreeing, have no
        defensible resolution.

        The rung actually used is recorded as an **audit fact and not a
        user-facing one**: the record and the operator surface carry
        `target_auth_method` and `target_auth_rung` (the 0-based index), and the
        user is told nothing (D14). This is the one place PLAN §4.3's disclosure
        rule does not apply, and the reason is that the information is about the
        estate rather than about the user's own request — "you got the weaker
        credential" tells an attacker which targets are softest and tells an
        honest user nothing they can act on. Do not "fix" that.
      items:
        $ref: '#/components/schemas/TargetAuth'
      example:
        - method: ephemeral-account
          params:
            username: hoplock
            platform: fortios
            credential_kind: publickey
            expiry_posture: target-enforced
            lifetime_seconds: '900'
        - method: brokered-key
          params:
            username: netadmin
            credential_ref: appliance-fleet-2026

    EnforcementPolicy:
      type: object
      description: |
        Where this connection's policy is **enforced**, on each of two axes
        (contract v4, PLAN §6.5, rendered by phase 0019).

        D12 says the quiet part itself: reliable interception of an
        unrestricted shell command is still an unrestricted shell. Both exec
        tiers are enforced in the proxy, at the `exec` request, so both stop
        meaning anything the moment a route permits an interactive shell. This
        object is how a server says the same `restricted_exec` policy is to be
        enforced somewhere that survives it — on the ephemeral account the
        proxy creates, where it also survives a connection that never went
        through a proxy.

        **Absent object ⇒ both axes take their default**, which is exactly the
        behaviour a v3 server produced: the proxy decides at the `exec`
        request, and forwarding policy covers SSH channels only. Each axis is
        independent — a route may set either, both, or neither.

        **A rung the proxy cannot provide is an outage-class denial** naming
        the session id (PLAN §4.3), **never a silent downgrade** to a weaker
        rung. That is D6a's rule for credential methods applied unchanged, and
        for the same reason: a session that runs at a weaker tier than its
        audit record claims is worse than a session that does not run. The
        audit record carries the rung that was **actually in force**, not the
        one requested.

        **Applied versus attested.** An *applied* rung is one the proxy
        configures per session and tears down; an *attested* rung
        (`platform-attested` on either axis) is one the target enforces
        already, configured by somebody who is not this product, where the
        proxy configures nothing and records who says so. Attested rungs are
        how the appliance estate gets a real enforcement claim instead of "none
        available", and they are the only kind a `brokered-key` route can
        carry.

        **The coupling to the credential method is conditional, not
        absolute.** An applied rung needs the proxy to administer the account,
        which only `ephemeral-user` and `ephemeral-account` do. Since D14 a
        route names an *ordered ladder*, so the rung is a property of the
        **route** and an entry that cannot carry it is a **skipped rung**
        (D14) — the proxy walks on, and never runs the session without the rung
        its record would claim. A response naming an applied rung where **no**
        entry in the named ladder provisions the target is refused outright: a
        policy that can only fail at connect time is a policy that fails in
        front of a user.
      properties:
        execution:
          type: string
          enum:
            - proxy-inspected
            - no-interactive-shell
            - account-restricted
            - account-confined
            - platform-authorized
            - platform-attested
          description: |
            Where the limit on what the session may **execute** is enforced
            (axis 1). **Absent ⇒ `proxy-inspected`.**

            - `proxy-inspected` — what the proxy sees at the `exec` request is
              what the proxy decides (D12's two tiers). Guarantees nothing
              about a session that was permitted a shell, and nothing at all
              about a connection made around the proxy. *Applied, proxy.*
            - `no-interactive-shell` — the session can obtain no interactive
              shell or terminal, so every command it runs is one the proxy
              decided. It needs nothing of the target and is enforced on an
              axis that has shipped since phase 0006, which makes it the
              cheapest strong rung in the table. `permitted_requests` must
              deny `shell` and `pty-req`, or the response is refused: the claim
              and the policy carrying it have to agree. *Applied, proxy.*
            - `account-restricted` — the **account** can execute only the
              executables `restricted_exec` names, for every login to it,
              including one that never went through this proxy. Requires
              `filter_policy.exec_mode: restricted`, which is the only place
              the contract names an executable. *Applied, target.*
            - `account-confined` — `account-restricted` plus a kernel- or
              service-manager-enforced confinement of the session's processes:
              they cannot gain privilege and cannot execute anything the
              session itself wrote. It is the rung that survives an uploaded
              binary. *Applied, target.*
            - `platform-authorized` — the **device's own** command authorizer
              decides, for the account the proxy created, under the role named
              in `platform_role`. It runs ahead of anything the proxy could
              parse (D13). *Applied, target.*
            - `platform-attested` — the target enforces its own command
              authorization on the account already and the proxy configures
              nothing. Requires `attestation`. *Attested.*
        reach:
          type: string
          enum:
            - proxy-channel-policy
            - account-egress-restricted
            - account-network-isolated
            - platform-attested
          description: |
            Where the limit on what the session may **reach** is enforced
            (axis 2). **Absent ⇒ `proxy-channel-policy`.**

            This is a second axis rather than a corner of the first because an
            account that can run exactly `uptime` and `cat`, and can also open
            a socket to anything in the estate, is a pivot point wearing an
            allow-list.

            - `proxy-channel-policy` — `permitted_forwards` and
              `permitted_global_requests` decide, per channel open and global
              request. **It covers SSH-channel forwarding and nothing else**: a
              process the session starts on the target opens its own sockets
              and never touches a channel, so the proxy cannot see it, let
              alone deny it. *Applied, proxy.*
            - `account-egress-restricted` — the session's own processes reach
              only the destinations in `permitted_destinations`; a connection
              anywhere else fails on the target, whether or not it went through
              an SSH channel. *Applied, target.*
            - `account-network-isolated` — the session's processes reach
              nothing off the host at all. *Applied, target.*
            - `platform-attested` — the target already constrains what the
              account can reach and the proxy configures nothing. Requires
              `attestation`. *Attested.*
        platform_role:
          type: string
          description: |
            The device role, access profile, or privilege level the ephemeral
            account is scoped to. **Required** by
            `execution: platform-authorized` and forbidden otherwise.

            It is opaque to the contract and handed to the driver as data, for
            the reason the platform vocabulary is open at all (D13): the set of
            role names is as open as the set of platforms. It is deliberately
            not called an access profile — that is one vendor's word for it.
          example: prof_admin
        permitted_destinations:
          type: array
          description: |
            Destinations a `account-egress-restricted` session's own processes
            may open. **Required and non-empty** for that rung, forbidden
            otherwise.

            It reuses `ForwardDestination`'s **shape** and shares none of its
            meaning: `permitted_forwards` is a rule about SSH channels the
            proxy sees, this is a rule about sockets the target's kernel sees.
            Naming a destination the same way in both is the point — an
            operator writes one vocabulary — but the two are never merged, and
            one never widens the other.
          items:
            $ref: '#/components/schemas/ForwardDestination'
        attestation:
          $ref: '#/components/schemas/Attestation'

    Attestation:
      type: object
      description: |
        The source of an **attested** enforcement rung (contract v4).

        An attested rung is a claim this system does not verify: the target
        enforces something already, configured by somebody who is not this
        product, and the proxy applies nothing. An unverified claim in an audit
        record is a liability, so the contract's answer is not to pretend
        otherwise but to make the claim **attributable** — the record carries
        who asserted it and where the assertion lives, and says plainly that
        the proxy verified neither.

        Required when either axis is `platform-attested`; forbidden otherwise,
        because an attestation beside a rung the proxy rendered itself would
        leave a reader unable to tell which half the record meant.
      required: [asserted_by, reference]
      properties:
        asserted_by:
          type: string
          description: |
            Who makes the claim: the team, system, or role that configured the
            target's own enforcement.
          example: network-engineering
        reference:
          type: string
          description: |
            Where the assertion lives — a configuration baseline, a standard, a
            ticket, a control id. Required, and required to be something an
            auditor can follow: "trust us" and an empty string are the same
            answer.
          example: NET-BASELINE-7.2 §4 (edge firewall RBAC)
        asserted_at:
          type: string
          format: date-time
          description: |
            When the claim was last affirmed. Absent means the assertion
            carries no date, which is itself worth recording.

    GrantContext:
      type: object
      description: |
        **Why** access was granted, as an external system asserted it (contract
        v4, D16, PLAN §13 UC3). Absent means no external grant context, which
        is today's behaviour.

        `decision_id` correlates a decision; nothing else carries the ticket,
        the scan, or the window. This does.

        **The proxy treats all of it as opaque.** It is copied to every log
        record for the session, and it is **never parsed, never matched
        against, and never the basis of a proxy-side decision** — the next
        reader's instinct will be to make policy out of it, and D2 says that
        decision was already made upstream, by the PDP, before this response
        was written. It is also **not shown to the user** on denial: a denial
        stays vague (PLAN §4.3), and this text is about the estate rather than
        about the user's own request.

        The systems on the other end are Control's and Enterprise's (D15). The
        proxy never learns that any of them exist.
      properties:
        system:
          type: string
          description: The external system that asserted the grant. Opaque.
          example: qualys
        reference:
          type: string
          description: |
            That system's own handle for the assertion — a ticket, a scan id,
            an incident number. Opaque.
          example: SCAN-2026-09-04-1183
        window_start:
          type: string
          format: date-time
          description: |
            Start of the window the external system asserted. **Recorded, not
            enforced.**
        window_end:
          type: string
          format: date-time
          description: |
            End of the window the external system asserted. **Recorded, not
            enforced** — the bound the proxy enforces is `session_deadline`,
            which the PDP sets having already weighed this window. Two fields
            that look like a deadline and are not one would be a trap, so the
            difference is stated here rather than left to be discovered.
        additional_context:
          description: |
            Whatever else the integration wanted recorded. It accepts a **JSON
            string or a JSON object**, because the systems on the other end
            differ more than a fixed schema can absorb: one has a sentence,
            another has a bag of fields, and forcing either into the other's
            shape would make the record worse. Anything else — a number, a
            list, a boolean — is a contract violation rather than something to
            coerce, because the proxy stores this verbatim for an auditor and
            must not put words in the server's mouth.

            Like the context it hangs on, it is carried and logged, never read
            for a decision.
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
          example:
            scan_profile: authenticated-linux
            requested_by: soc-oncall

    ConcurrencyLimits:
      type: object
      description: |
        How many sessions may be live at once (contract v4, PLAN §13 UC2).
        Both scopes are optional and independent; **absent (or `0`) means
        uncapped**, which is today's behaviour.

        It is a field here rather than a decision Control makes alone from
        `conn` because the live session count is knowable **only to the
        proxy**, which is the party holding the session registry.

        Exceeding a cap is a **policy denial** — deliberately vague, PLAN §4.3
        — and never an outage: the estate is healthy and the answer is "no",
        which is exactly what a denial means.
      properties:
        max_sessions_per_subject:
          type: integer
          format: int32
          minimum: 0
          description: |
            Live sessions permitted for one authenticated subject, across every
            target. `0` or absent is uncapped.
          example: 3
        max_sessions_per_target:
          type: integer
          format: int32
          minimum: 0
          description: |
            Live sessions permitted to one target, across every subject. `0` or
            absent is uncapped.

            A per-target ceiling exists whether or not policy names one: PLAN
            §5.1 records that `useradd` and `userdel` serialise on the target's
            own account database, so an `ephemeral-user` fleet has a
            provisioning ceiling no amount of proxy capacity moves.
          example: 10

    ProxyCapabilities:
      type: object
      description: |
        The enforcement rungs a **proxy build** can provide at all (contract
        v4), declared on `AuthorizeRequest` beside `policy_version` — the same
        pattern, for the same reason.

        It answers only "can this software do it", never "can this target take
        it": what is available depends on the target far more than on the
        proxy, and finding that out needs a login (see
        `POST /v1/capabilities/report`).

        **Absent declares nothing**, which is what a v3 proxy implies and is
        the fail-safe reading: a server choosing from it can then only choose a
        rung that needs no capability at all — the two proxy-side defaults, and
        an attested rung, which nobody here applies.
      properties:
        execution:
          type: array
          items:
            type: string
          example: [proxy-inspected, no-interactive-shell, account-restricted]
        reach:
          type: array
          items:
            type: string
          example: [proxy-channel-policy, account-network-isolated]

    TargetCapabilities:
      type: object
      description: |
        The enforcement rungs one **target** can take, as the proxy found them
        by connecting to it (contract v4, probed by phase 0019).

        Whether a target runs systemd, whether cgroup v2 is mounted, whether
        SELinux is enforcing, whether netfilter is reachable, whether it is a
        Linux host at all — none of that is knowable from a policy database,
        and all of it decides which rungs are real.
      required: [observed_at]
      properties:
        execution:
          type: array
          items:
            type: string
          example: [proxy-inspected, no-interactive-shell, account-restricted, account-confined]
        reach:
          type: array
          items:
            type: string
          example: [proxy-channel-policy, account-egress-restricted]
        observed_at:
          type: string
          format: date-time
          description: |
            When the proxy probed. A record with **no observation time is
            treated as stale**, because a capability with no date has no shelf
            life — and a stale record and an absent one mean the same thing to
            anyone choosing a rung from it.
        detail:
          type: object
          additionalProperties:
            type: string
          description: |
            Free-form observation for an operator reading the console — which
            init the target runs, which module was missing. Never parsed, never
            the basis of a decision.
          example:
            init: systemd-257
            cgroup: v2

    CapabilityReportRequest:
      type: object
      required: [target, capabilities, conn]
      properties:
        target:
          type: string
          description: The host the capabilities were observed on.
          example: host.company.com
        target_port:
          type: integer
          format: int32
          description: The port, when it is not the default.
        platform:
          type: string
          description: |
            The device driver that observed them, for an `ephemeral-account`
            target. Absent for a POSIX host.
          example: fortios
        capabilities:
          $ref: '#/components/schemas/TargetCapabilities'
        conn:
          $ref: '#/components/schemas/ConnMeta'

    CapabilityReportResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
          description: |
            True when the server recorded the report. A report the server did
            not record is one the proxy must not believe it made, so anything
            else is a contract violation.
        report_after_seconds:
          type: integer
          format: int32
          minimum: 0
          description: |
            When the server would like the next observation, in seconds. Absent
            or `0` leaves the interval to the proxy. The server owns the
            freshness of its own record, on the same reasoning as
            `cache.ttl_seconds`: a proxy may re-observe sooner, never later.
          example: 900

    CacheHint:
      type: object
      description: |
        The server authorising the proxy to **reuse this decision** for later
        connections (PLAN §6.4, D2). Absent means: do not cache. There is no
        default lifetime and the proxy never invents one.

        The lifetime belongs to the server. A proxy may hold the decision for
        less time than `ttl_seconds` (an operator may configure a stricter local
        clamp) but never longer, so the PDP keeps ownership of its own risk
        appetite and can decline caching for a sensitive target by omitting this
        object.

        A cached allow outlives a withdrawal of access for up to `ttl_seconds`,
        which is what `GET /v1/proxies/{proxy_id}/events` exists to bound. A
        server that issues cache hints must serve that stream; a proxy that
        cannot hear it stops using its cache.
      required: [ttl_seconds]
      properties:
        key:
          type: string
          description: |
            Opaque handle for this decision. The proxy MUST NOT construct,
            parse, or derive meaning from it — it only echoes the key back in a
            `cache_invalidate` event.

            The server's choice of key decides the **sharing scope**: two
            requests answered with the same key are one cached decision and are
            invalidated together, so a key may be per subject+target, per
            subject, per permission set, and so on. A key MUST NEVER be shared
            across identities: it would let one user be served another user's
            policy. Required whenever `ttl_seconds` is greater than zero.
          example: authz:alice@example.com:host.company.com:v7
        ttl_seconds:
          type: integer
          format: int32
          minimum: 0
          description: |
            How long the decision may be reused, in seconds. `0` (or an absent
            `cache` object) means do not cache. Keep it short — seconds to low
            minutes — because it is the window in which a revoked authorization
            can still be honoured if the event stream is also down.
          example: 60

    RevocationEvent:
      type: object
      description: |
        One line of `GET /v1/proxies/{proxy_id}/events`. The payload property
        named by `type` is present; the others are absent.
      required: [event_id, type, timestamp]
      properties:
        event_id:
          type: string
          description: |
            Server-assigned, opaque id. The proxy stores the last one it
            processed and sends it back as `last_event_id` on reconnect; it
            never parses or orders by it itself.
          example: evt-00000042
        type:
          type: string
          enum: [session_kill, cache_invalidate, heartbeat, resync]
          description: |
            `session_kill` — end sessions that are running now.
            `cache_invalidate` — drop cached authorize decisions.
            `heartbeat` — liveness only, so a silently dead stream is
            detectable.
            `resync` — the proxy missed events that cannot be replayed: it
            drops its entire cache and re-authorizes from scratch.

            A proxy ignores a type it does not recognise, so the server may
            add types without breaking older proxies.
        timestamp:
          type: string
          format: date-time
          description: When the server emitted the event.
        session_kill:
          $ref: '#/components/schemas/SessionKillEvent'
        cache_invalidate:
          $ref: '#/components/schemas/CacheInvalidateEvent'

    SessionKillEvent:
      type: object
      description: |
        Ends sessions that are already in flight. Exactly one of `session_ids`,
        `subject`, or `all` selects what dies. Killing sessions for a subject
        also drops that subject's cached decisions on the proxy, so the user
        cannot immediately reconnect through a decision that is on its way out.
      properties:
        session_ids:
          type: array
          description: Sessions to end, by the proxy-assigned `session_id`.
          items:
            type: string
          example: [01HQ2Z3K4M5N6P7Q8R9S0T1V2W]
        subject:
          type: string
          description: End every session belonging to this subject.
          example: alice@example.com
        all:
          type: boolean
          description: End every session on this proxy.
        reason:
          type: string
          description: |
            Operator-authored text explaining the termination. It is **shown to
            the user** before the connection closes and copied into the audit
            log (PLAN §4.3), so that a revoked session is never mistaken for a
            crash or a network fault. Because it is displayed verbatim, it must
            be safe to disclose: no policy internals, no other users, no
            infrastructure detail. A server should always set it; a proxy that
            receives none shows a generic message instead.
          example: Access withdrawn by the security team; contact #security.

    CacheInvalidateEvent:
      type: object
      description: |
        Drops cached authorize decisions. Exactly one of `keys`, `subject`, or
        `all` selects what goes. It does not touch running sessions — those hold
        their own policy snapshot and are ended with `session_kill`.
      properties:
        keys:
          type: array
          description: Cache keys to drop, exactly as the server issued them.
          items:
            type: string
          example: [authz:alice@example.com:host.company.com:v7]
        subject:
          type: string
          description: Drop every decision cached for this subject.
          example: alice@example.com
        all:
          type: boolean
          description: Drop the proxy's entire decision cache.

    FilterPolicy:
      type: object
      description: |
        Command filter policy for the connection (PLAN §6.3).

        `rules` are evaluated **in order and the first match wins**, so a
        specific rule placed before a broad one decides the outcome: `rm -rf /`
        can kill the session while `rm *` only warns. A command matching no rule
        is decided by `mode`, which is required so a policy always has a defined
        default and cannot fail open by omission.
      required: [mode]
      properties:
        mode:
          type: string
          enum: [whitelist, blacklist]
          description: |
            What happens to a command **no rule matched**. `whitelist` — block
            it; the rules are the permitted set. `blacklist` — allow it; the
            rules are the caught set. A `blacklist` with no rules means "no
            filtering"; a `whitelist` with no rules blocks everything.
        rules:
          type: array
          description: |
            Ordered pattern→action rules. Each rule carries its own action, so
            one policy can warn on one command and kill the session on another.

            This is the **filtered exec** tier — a guardrail, not a boundary
            (D12): every `exec` command is seen before it runs, but `sh -c`,
            any interpreter, an editor shell escape, or a base64 pipe still
            gets past a pattern. It MUST be empty when `exec_mode` is
            `restricted`.
          items:
            $ref: '#/components/schemas/FilterRule'
        exec_mode:
          type: string
          enum: [filtered, restricted]
          default: filtered
          description: |
            Which tier decides an `exec` request (D12, enforced by phase 0010).
            **Absent means `filtered`**, which is v1 behaviour.

            `filtered` — `rules` decide, and `restricted_exec` MUST be absent.
            `restricted` — `restricted_exec` decides and MUST be present, and
            `rules` MUST be empty.

            The two are **alternatives, not layers**. A policy that sets both a
            rule list and `restricted_exec` is a contract violation the proxy
            refuses outright: silently resolving it would mean a guardrail and a
            boundary disagreeing about the same command, with no defensible
            answer for which won.

            `mode` keeps its meaning under `restricted`, but only for the
            best-effort interactive tier: with an empty rule list, `whitelist`
            blocks every command typed into an interactive shell and
            `blacklist` leaves them to audit alone. It says nothing about
            `exec`, where "not named ⇒ denied" is the whole point.
        restricted_exec:
          $ref: '#/components/schemas/RestrictedExecPolicy'

    RestrictedExecPolicy:
      type: object
      description: |
        The **restricted exec** tier (D12, enforced by phase 0010): a
        default-deny allow-list of executables together with the shape of their
        permitted arguments. Present only when `filter_policy.exec_mode` is
        `restricted`.

        This is the tier sold as enforcement, and what earns that word is the
        mechanism, not the strictness:

        - the `exec` command string is **parsed** into an argument vector using
          POSIX shell word splitting and quote removal, not pattern-matched;
        - a command that cannot be represented as a single argument vector is
          **denied before any matching happens** — anything containing `;`,
          `|`, `&`, `` ` ``, `$(`, `${`, `<`, `>`, a newline, or an unterminated
          quote, because those are shell syntax and there is no argv that means
          them;
        - the parsed vector must match one entry of `commands` **completely**:
          every argument is covered by the entry or the command is denied;
        - the approved vector is run **directly** on the target, never through
          `sh -c`, so nothing re-expands what was approved.

        An empty `commands` list denies every `exec`, which is a coherent
        policy (a route that may log in interactively but run no one-shot
        command) rather than an accident.
      required: [commands]
      properties:
        commands:
          type: array
          description: |
            Permitted commands. They are tried in order and the first entry
            whose executable matches and whose argument shape accepts the
            vector permits the command; if none does, it is denied.
          items:
            $ref: '#/components/schemas/RestrictedCommand'

    RestrictedCommand:
      type: object
      description: One permitted executable and the shape of its permitted arguments.
      required: [executable, form]
      properties:
        executable:
          type: string
          description: |
            Matched against `argv[0]` exactly, as written by the user. A policy
            that means `/usr/bin/systemctl` says so; a policy that means
            `systemctl` accepts only the bare name and leaves resolution to the
            target's `PATH`. The proxy performs no `PATH` search, no symlink
            resolution, and no basename comparison of its own — every one of
            those would silently accept a name the server did not write.
          example: systemctl
        form:
          type: string
          enum: [exact, positional]
          description: |
            `exact` — `argv` is the complete argument vector and the command
            must equal it.
            `positional` — `args` describes the arguments one position at a
            time.
        argv:
          type: array
          description: |
            Required when `form` is `exact`, forbidden otherwise. The complete
            argument list **after** the executable, compared element by element;
            a vector of a different length does not match.
          items:
            type: string
          example: [status, nginx.service]
        args:
          type: array
          description: |
            Required when `form` is `positional`, forbidden otherwise. One spec
            per argument position, in order, after the executable.

            **Arguments not covered by a spec are denied.** There is no
            trailing allowance and no wildcard tail: a vector longer than
            `args` never matches, so the shape of a permitted command is
            bounded by what the server wrote. Optional positions are expressed
            by `optional` on the specs at the end of the list.
          items:
            $ref: '#/components/schemas/ArgumentSpec'

    ArgumentSpec:
      type: object
      description: The permitted shape of one argument position.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [literal, prefix, oneof, any]
          description: |
            `literal` — the argument must equal `value`.
            `prefix` — the argument must start with `value`, which MUST NOT be
            empty (e.g. `--unit=` permits `--unit=nginx.service`).
            `oneof` — the argument must equal one of `values`.
            `any` — the argument is unconstrained.

            `any` is named rather than smuggled in as an empty prefix so that
            it is visible in the policy and in the audit record. It is the one
            shape in this schema that is **not** a boundary, and a reviewer
            should be able to find every use of it by searching for the word.
        value:
          type: string
          description: Required and non-empty for `literal` and `prefix`; forbidden otherwise.
          example: "--unit="
        values:
          type: array
          description: Required and non-empty for `oneof`; forbidden otherwise.
          items:
            type: string
          example: [status, is-active]
        optional:
          type: boolean
          default: false
          description: |
            Whether this position may be absent. Only trailing positions may be
            optional: once a spec is optional every spec after it must be too,
            or the positions after it would be ambiguous.

    FilterRule:
      type: object
      description: One command pattern and the action taken when it matches.
      required: [match, action]
      properties:
        match:
          type: string
          description: |
            Command pattern. Matching semantics are defined by the filter engine
            (phase 0009) and do not depend on `mode`.
          example: rm -rf /
        action:
          type: string
          enum: [allow_and_log, block_command, warn_and_continue, kill_session]
          description: What the proxy does when this rule matches.
        message:
          type: string
          description: |
            Optional operator-authored text shown to the user when this rule
            fires. Displayed verbatim, so it MUST NOT contain policy internals
            (PLAN §4.3).
          example: Destructive command. Raise a change request instead.

    HopMetadata:
      type: object
      description: |
        Chaining constraints, present when `route_type` is `nexthop`.

        It also says **how** the next proxy is reached (D11, consumed by phase
        0008). That is not a detail inside the hop protocol — it is the hop
        protocol, which is why it is in the contract before the phase that
        builds it.
      properties:
        connection:
          type: string
          enum: [dial, relay]
          default: dial
          description: |
            How this proxy reaches the next one.

            `dial` — this proxy opens a TCP/SSH connection to `target`. Simple,
            and it needs an inbound firewall rule at the next hop.
            `relay` — the next proxy has already **registered an outbound relay
            connection** with this one, and this proxy opens a channel over
            that existing connection instead of dialling. The protected zone
            needs no inbound rule at all, which is the whole point: one hole per
            hop is still a hole per hop.

            **Absent means `dial`**, the original next-hop behaviour, so a v1
            server's route still works.

            A `relay` hop with **no live registration** for `next_proxy_id` is
            an outage (PLAN §4.3), reported as one. It is never silently
            downgraded to `dial`: dialling would punch through exactly the
            boundary the mode exists to preserve, and it would do it at the
            moment the operator is least able to see it.
        next_proxy_id:
          type: string
          description: |
            The proxy id of the next hop — the same id that proxy presents when
            it registers, which is how a `relay` hop selects the registration to
            open a channel over. **Required when `connection` is `relay`.**

            On a `dial` hop it is informational: it names the peer expected at
            `target`, for logs and for the hop trail.
          example: proxy-zone-b
        final_target:
          type: string
          description: |
            The end host the chain is being built toward; forwarded to the next
            proxy so it can re-run the flow for the same target.
          example: host.company.com
        max_hops:
          type: integer
          format: int32
          minimum: 1
          description: |
            Maximum total hops allowed for this session. The proxy refuses to
            chain further once `conn.hop_trail` reaches this length.
          example: 3
        hop_trail:
          type: array
          description: |
            Hop trail to forward to the next proxy, this proxy appended.
            Used for loop detection (PLAN §6.1).
          items:
            type: string

    HostKeyReportRequest:
      type: object
      required: [target, host_key, conn]
      properties:
        target:
          type: string
          example: host.company.com
        target_port:
          type: integer
          format: int32
          example: 22
        host_key:
          $ref: '#/components/schemas/PublicKeyMaterial'
        conn:
          $ref: '#/components/schemas/ConnMeta'

    HostKeyReportResponse:
      type: object
      required: [decision, known]
      properties:
        decision:
          type: string
          enum: [accept, reject]
          description: Whether the proxy may continue the target handshake.
        known:
          type: boolean
          description: |
            False when the server had not seen this key for this target before
            (first use). The prototype accepts and records it (D7); a stricter
            policy can reject while keeping the same shape.
        reason:
          type: string
          description: Human-readable explanation, for logs.

    LogRecord:
      type: object
      description: One structured session log record (PLAN §7).
      required: [record_id, session_id, timestamp, kind, severity]
      properties:
        record_id:
          type: string
          description: |
            Client-assigned unique id, used by the server to de-duplicate
            retried batches.
        session_id:
          type: string
          description: Ties the record to a session; matches `ConnMeta.session_id`.
        timestamp:
          type: string
          format: date-time
        kind:
          type: string
          description: |
            Record type: `session_start`, `session_end`, `auth`, `authorize`,
            `channel_open`, `channel_close`, `command`, `policy_decision`,
            `host_key`, `stream`, `provisioning`, `error`.
          example: command
        severity:
          type: string
          enum: [info, warn, critical]
          description: |
            `critical` records are the ones shipped via `/v1/logs/priority`.
        message:
          type: string
          description: Human-readable summary. MUST NOT contain credentials.
        subject:
          type: string
          description: Identity subject the record concerns.
        login:
          type: string
        target:
          type: string
        attributes:
          type: object
          description: Structured detail, e.g. the matched command and action.
          additionalProperties:
            type: string
        payload:
          type: string
          format: byte
          description: |
            Base64 stream capture for replay-oriented records (`stream`).
            Omitted for everything else.

    LogBatchRequest:
      type: object
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LogRecord'

    LogBatchResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: integer
          format: int32
          description: |
            How many records the server stored. Fewer than sent means the rest
            were duplicates; the proxy may drop them.

    LogPriorityRequest:
      type: object
      required: [record]
      properties:
        record:
          $ref: '#/components/schemas/LogRecord'

    LogPriorityResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
          description: True once the record is durable.
        receipt_id:
          type: string
          description: Server-side id of the stored record, for audit.
