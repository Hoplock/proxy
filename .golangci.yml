# golangci-lint configuration (schema v2).
# Run with `make lint`; formatting is applied with `make fmt`.
version: "2"

run:
  # Lint the e2e scenario suite as well. It is behind the `e2e` build tag
  # because it needs Docker and costs minutes, so without this it would be
  # invisible to every check the repository has.
  build-tags:
    - e2e

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # Test helpers may ignore errors that would be fatal in production code.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hoplock/proxy
