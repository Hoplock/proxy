# golangci-lint configuration (schema v2).
# Run with `make lint`; formatting is applied with `make fmt`.
version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # Test helpers may ignore errors that would be fatal in production code.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mauroasilva/securecommandproxy
