name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  # Latest stable Go: what the project develops against, and the only version
  # the lint job runs on. The *minimum* supported version is the `go` directive
  # in go.mod, which is a lower number on purpose (PLAN §8).
  GO_VERSION: "1.26"

jobs:
  build-test:
    name: build, vet, test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      # Report both legs. A floor-only failure and a latest-only failure mean
      # very different things, so never hide one behind the other.
      fail-fast: false
      matrix:
        # The floor declared by go.mod, and GO_VERSION above. Building on the
        # floor is the only thing that keeps that directive honest — without
        # it, "min <x>" is an untested claim and the first use of a
        # newer-than-floor API would break consumers silently.
        #
        # They COINCIDE at the moment: golang.org/x/crypto v0.56.0 requires Go
        # 1.26, which moved the floor to the release CI already tracks (D9: the
        # floor moves when x/crypto moves it). One entry is therefore the whole
        # matrix until Go 1.27 ships and GO_VERSION moves ahead of the floor
        # again — at which point this list grows back to two and the comment
        # above starts earning its keep again.
        go: ["1.26"]
    env:
      # Pin the toolchain to the matrix version. With the default (auto), a
      # go.mod floor newer than the installed Go is silently satisfied by
      # downloading a newer toolchain — both legs would then test the same
      # version and the floor leg would prove nothing. With `local`, raising
      # the go directive past the matrix fails this job loudly, which is the
      # reminder to update it.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - uses: golangci/golangci-lint-action@v8
        with:
          # Must be built with a Go at least as new as the `go` directive in
          # go.mod: golangci-lint type-checks with the Go version it was
          # compiled against, so an older binary refuses the module outright
          # ("the Go language version (go1.25) used to build golangci-lint is
          # lower than the targeted Go version (1.26.0)"). Bump this whenever
          # the floor or GO_VERSION moves to a new minor.
          #
          # Which release is safe is checkable rather than guessable: a
          # release's own `go` directive is what its binaries are built with.
          # v2.12.2 declares go 1.25.0 and v2.13.2 declares go 1.26.0, which is
          # why this moved with the floor rather than staying put.
          version: v2.13.2

  openapi:
    name: openapi contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install the OpenAPI validator
        run: pip install openapi-spec-validator==0.9.0

      - name: validate api/control.yaml
        run: make openapi-check

  license:
    name: license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check license headers
        run: make license-check

  e2e:
    name: e2e topology
    runs-on: ubuntu-latest
    # The whole system, in containers: build, five nodes, scenario suite,
    # teardown (docs/PLAN.md §9). It is the acceptance gate for the prototype,
    # and the only job that can catch a regression in how the parts fit
    # together rather than in one of them.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Split from `make e2e` on purpose: the local target tears the topology
      # down on the way out, and this job wants the containers' logs first.
      - name: bring the topology up
        run: make e2e-up

      - name: run the scenario suite
        run: go test -tags e2e -count=1 -v -timeout 20m ./test/e2e/

      - name: topology logs
        if: always()
        run: docker compose -p hoplock-e2e -f deploy/compose.yaml logs --no-color --tail 500

      - name: tear the topology down
        if: always()
        run: make e2e-down

  test-sshd:
    name: target credentials (real sshd)
    runs-on: ubuntu-latest
    # The tests that only a real sshd and a real kernel can answer, against the
    # container deploy/target builds: does sshd honour the `authorized_keys`
    # options an enforcement rung writes, for a connection that never went
    # through the proxy; does a per-uid packet filter actually refuse a
    # destination the policy did not name; does `useradd` handing out a freed
    # uid give the next session anything the last one was standing behind.
    #
    # It is a SEPARATE JOB from `e2e topology` rather than another step in it,
    # because the two answer different questions and a reviewer should not have
    # to open a log to find out which one broke. They also share nothing but the
    # image: this one publishes the target on a host port and drives it from the
    # runner, with no proxy in the path at all — which is precisely the point,
    # since the claim under test is that the rung holds without one.
    #
    # Everything here also skips cleanly without the container (each test calls
    # requireSSHD), so `go test ./...` in the build job stays green on a machine
    # with no Docker. This job is what stops that skip from being permanent.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Split from `make test-sshd` for the reason the e2e job is split: the
      # local target tears the container down on the way out, and this job wants
      # its log first.
      - name: bring the target up
        run: make test-sshd-up

      - name: run the target-credential tests
        run: make test-sshd-run

      - name: target log
        if: always()
        run: HOPLOCK_SSHD_PORT=2022 docker compose -p hoplock-sshd -f deploy/target/compose.yaml logs --no-color --tail 500

      - name: tear the target down
        if: always()
        run: make test-sshd-down

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    # golang.org/x/crypto/ssh is not an incidental dependency here — it IS this
    # proxy's SSH implementation, and its advisory rate is high. The v0.44.0 →
    # v0.55.0 bump alone crossed 15 fixed advisories, around six of them
    # server-side DoS and panic issues in x/crypto/ssh itself, landing in
    # exactly the paths phases 0005–0009 build on. So "is our SSH stack
    # currently vulnerable?" has to be an answer this pipeline produces.
    #
    # THIS JOB CAN GO RED WITH NO CODE CHANGE, when a new advisory lands against
    # a dependency already in go.mod. That is the intended signal, not a flake:
    # the fix is to upgrade the dependency, or — if no fix exists yet — to
    # record an explicit, dated justification. Never to delete the job.
    #
    # It uses govulncheck's default symbol-level analysis rather than a plain
    # dependency scan, so it reports only vulnerabilities REACHABLE from this
    # module's code. That is what keeps it from crying wolf about (say) an
    # ssh/agent advisory in a package the proxy never calls into.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Downloads the vulnerability database from https://vuln.go.dev at run
      # time. GitHub-hosted runners reach it; some development sandboxes cannot,
      # which is why `make vulncheck` reports that case as a skip and why this
      # check is not in docs/PROTOCOL.md's Definition of Done. Here it must pass.
      - name: govulncheck ./...
        run: govulncheck ./...
