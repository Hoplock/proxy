# Hoplock Proxy — proxy bootstrap configuration (example).
#
# Copy to config.yaml and edit. This file holds only what the proxy needs to
# start and reach Hoplock Control: every authentication, authorization,
# routing, and filtering decision is made by Hoplock Control per
# connection (see docs/PLAN.md, D2).

proxy:
  # Identifier Hoplock Control knows this proxy by. It is on every
  # management call and addresses this proxy's revocation stream, so it must
  # match what Hoplock Control was told to expect.
  id: "proxy-1"
  # host:port the SSH listener binds to.
  listen_addr: "0.0.0.0:2222"
  # Path to this proxy's SSH host private key. Never commit a real key.
  host_key_path: "/etc/hoplock/host_key"

control:
  # Root URL of the Control API (the policy decision point).
  base_url: "https://control.example.com"
  # Bearer token authenticating this proxy to Hoplock Control. Optional;
  # supply it from the deployment's secret store, never from a committed file.
  token: ""
  # Reuse of authorize decisions Hoplock Control explicitly permitted.
  # Nothing here can widen a decision — the server sets the lifetime and can
  # withdraw it at any time over the revocation stream. All optional.
  cache:
    # Clamp on the server's lifetime. 0 (the default) honours it exactly; any
    # other value only makes this proxy ask more often than it was allowed to,
    # and every decision it shortens is counted and logged.
    max_ttl: 0s
    # How long the revocation stream may be unheard before the cache stops
    # serving anything and every connection is re-authorized.
    stale_after: 30s

dial:
  # How long to wait for the target leg (dial plus SSH handshake). Optional.
  dial_timeout: 15s
  # Port used when Hoplock Control's route names none. Optional.
  default_target_port: 22

routing:
  # Single character separating the login from the target hostname in the SSH
  # username, e.g. "alice#host.company.com" (docs/PLAN.md, D1).
  # Optional; defaults to "#".
  target_delimiter: "#"

auth:
  # user -> proxy authentication (docs/PLAN.md §4.1).
  user:
    # Enabled methods. This is a set, not an order: the proxy always tries
    # certificates first and falls back to password + out-of-band MFA. Drop
    # "password-mfa" for a certificate-only proxy; an empty list is rejected.
    # Optional; defaults to both.
    methods: ["cert", "password-mfa"]
    # How the proxy waits for an out-of-band second factor. The management
    # server states the polling interval and the expiry; these only bound how
    # the proxy behaves while obeying them. All optional.
    mfa:
      # Floor on the server's requested polling interval.
      min_poll_interval: 500ms
      # How often the user is told the proxy is still waiting.
      progress_interval: 5s
      # Cap on the total wait. The server's expiry wins when it is sooner.
      max_wait: 2m
  # proxy -> target authentication (docs/PLAN.md §4.2).
  target:
    # Since contract v2 (phase 0006) Hoplock Control picks the method per route
    # in the authorize response's `target_auth` (D6a) — one proxy commonly
    # fronts hosts that accept just-in-time provisioning and appliances that
    # cannot. What stays here is the local material each method needs, plus this
    # FALLBACK, used only when the server sends no `target_auth` at all.
    #
    # "static-key" is the phase-0005 PLACEHOLDER: one preloaded key for every
    # session on every target, provisioning nothing and expiring nothing. It is
    # for development topologies only; the ephemeral just-in-time provisioner
    # (D6) and brokered-key (D6a) arrive in phase 0007.
    method: "static-key"
    static_key:
      # Private key the proxy logs into targets with. Never commit a real key.
      key_path: "/etc/hoplock/target_key"
      # Log into every target as this account instead of the authenticated
      # login. Optional; empty uses the login.
      username: ""
