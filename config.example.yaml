# Hoplock Proxy — proxy bootstrap configuration (example).
#
# Copy to config.yaml and edit. This file holds only what the proxy needs to
# start and reach Hoplock Control: every authentication, authorization,
# routing, and filtering decision is made by Hoplock Control per
# connection (see docs/PLAN.md, D2).

proxy:
  # Identifier Hoplock Control knows this proxy by. It is on every
  # management call and addresses this proxy's revocation stream, so it must
  # match what Hoplock Control was told to expect.
  id: "proxy-1"
  # host:port the SSH listener binds to.
  listen_addr: "0.0.0.0:2222"
  # Path to this proxy's SSH host private key. Never commit a real key.
  host_key_path: "/etc/hoplock/host_key"

control:
  # Root URL of the Control API (the policy decision point).
  base_url: "https://control.example.com"
  # Bearer token authenticating this proxy to Hoplock Control. Optional;
  # supply it from the deployment's secret store, never from a committed file.
  token: ""
  # Reuse of authorize decisions Hoplock Control explicitly permitted.
  # Nothing here can widen a decision — the server sets the lifetime and can
  # withdraw it at any time over the revocation stream. All optional.
  cache:
    # Clamp on the server's lifetime. 0 (the default) honours it exactly; any
    # other value only makes this proxy ask more often than it was allowed to,
    # and every decision it shortens is counted and logged.
    max_ttl: 0s
    # How long the revocation stream may be unheard before the cache stops
    # serving anything: every connection is re-authorized, and every target
    # host key is re-reported.
    stale_after: 30s
    # How many cached lookup paths this proxy holds. There are TWO KINDS and
    # they share this one number: one authorize path per (subject, login,
    # target, port, auth method, hop trail), and — where the server hints them
    # (contract 4.1, phase 0023) — one host-key path per (target, port, host
    # key fingerprint). 0 uses the package default of 32768.
    #
    # So a server hinting both decisions makes each connection cost two paths,
    # and an estate sized to its target count under phase 0022 covers half as
    # many targets now. Double the figure you would otherwise set. Nothing in
    # the name says this, which is exactly why it is said here.
    #
    # Size it from the estate, not from a memory budget. Past the bound the
    # cache evicts rather than refuses, which keeps a working set that CHANGES
    # cached — but eviction is not a substitute for a big enough cache: an
    # automation cycling through more targets than this holds evicts each entry
    # about one visit before it comes back, and the hit rate goes to nearly
    # zero (measured, load/results/08-uc2-fanout-evicting.json). The cost is
    # about 1 KiB of live heap per entry (measured, docs/PLAN.md §9.1) and
    # ~1.7 KiB of RSS with GC headroom, so the default is ~32 MiB of heap when
    # it is actually full, and one automation polling 300,000 targets wants
    # max_entries: 300000 and the ~300 MiB of heap that costs — 600000 and
    # ~600 MiB where the server hints host keys too. CacheStats'
    # Evicted counter is how a running proxy says this number is too small;
    # Expired says something else entirely — the server's TTLs are shorter
    # than the interval at which this proxy returns to the same target.
    max_entries: 0

dial:
  # How long to wait for the target leg (dial plus SSH handshake). Optional.
  dial_timeout: 15s
  # Port used when Hoplock Control's route names none. Optional.
  default_target_port: 22

session:
  # How the proxy behaves while obeying the bounds Hoplock Control puts on a
  # session (docs/PLAN.md §6.5, D16). Nothing here sets a deadline or extends
  # one — that is the server's answer, per connection.
  #
  # How long before a session's deadline the user is warned on their open
  # channels. Optional; 0 means the engine default (1m), and a negative value
  # sends no warning at all, leaving only the message at expiry. A lead time
  # longer than the whole deadline warns nobody rather than warning at once.
  deadline_warning: 1m

logging:
  # Telemetry pipeline (docs/PLAN.md §7, D8). These are throughput and
  # resilience knobs only: WHAT a session records is the architecture's answer,
  # not an operator's.
  #
  # Local resilience buffer. When Hoplock Control is unreachable, records are
  # written here — one directory per session — and drained in order when it
  # returns. It is a buffer and never the destination. Leaving it empty means
  # an outage loses records.
  buffer_dir: "/var/lib/hoplock/proxy/logbuf"
  # How many records accumulate before a batch is shipped. Optional.
  batch_size: 64
  # How long a partial batch waits. Optional; negative ships only on a full
  # batch or a critical record.
  flush_interval: 5s
  # Records held between the capture points and the shipping goroutine.
  # Optional. A full queue spills to buffer_dir rather than blocking a session.
  queue_size: 4096
  # Bounds one delivery attempt. Optional.
  send_timeout: 10s
  # Backoff between drain attempts after an outage. Optional.
  retry_min: 1s
  retry_max: 30s
  # Caps one stream-capture record's payload; larger reads split across
  # records. Optional.
  max_payload_bytes: 32768

routing:
  # Single character separating the login from the target hostname in the SSH
  # username, e.g. "alice#host.company.com" (docs/PLAN.md, D1).
  # Optional; defaults to "#".
  target_delimiter: "#"

chain:
  # Multi-hop routing (docs/PLAN.md, D11 and §6.1). Everything here is optional
  # and every field describes THIS PROXY: which sessions chain, and in which
  # direction, is decided by Hoplock Control per connection and delivered in
  # the route's hop metadata. A proxy configured for both directions still obeys
  # the one it is told.
  #
  # The key this proxy presents to another proxy — to the next hop when it
  # extends a chain, and to the upstream when it registers a relay. It is this
  # proxy's own identity, never the user's: the far side authenticates this
  # proxy and asks Hoplock Control to re-establish the user, so no hop takes
  # an upstream's word for who is connecting. Leave it empty on a proxy that
  # never chains; a next-hop route then fails as an outage rather than silently.
  identity_key_path: "/etc/hoplock/chain_identity"
  # Optional OpenSSH certificate for that key, for a fleet whose proxies are
  # certified by a CA. It must name this proxy's id among its principals.
  identity_cert_path: ""
  # Most proxies one session may traverse. 0 (the default) means 4. It can only
  # ever shorten a chain the server allowed, never lengthen one.
  max_hops: 4

  # Register an outbound relay connection with the proxy above this one, so it
  # can send sessions here WITHOUT dialling in. This is what removes the inbound
  # firewall rule for a protected zone. Omit the whole block on a proxy that is
  # reachable by dialling.
  upstream:
    # host:port of the upstream proxy's registration listener. Empty (the
    # default) registers nowhere.
    address: ""
    # The upstream's expected SSH host public key. Required whenever address is
    # set: this registration is an inbound path for sessions, so an unverified
    # upstream is one that can be impersonated into receiving them. There is no
    # trust-on-first-use here — fleet keys are known at deployment time.
    host_key_path: ""
    # Bounds on one attempt and on the reconnect delay. All optional.
    dial_timeout: 15s
    keepalive_interval: 10s
    min_backoff: 1s
    max_backoff: 30s

  # Accept relay registrations from the proxies below this one. Omit the whole
  # block unless the topology makes this proxy a relay hub.
  accept:
    # host:port the registration listener binds to. Empty (the default) accepts
    # no registrations. It is NOT the SSH listener above: users never reach it.
    listen_addr: ""
    # Key the registration listener presents. Empty reuses proxy.host_key_path.
    host_key_path: ""
    # Proxies allowed to register, in OpenSSH authorized_keys format. THE
    # COMMENT ON EACH LINE IS THE PROXY ID that key may register as — a key
    # naming no id could register as any of them and start receiving their
    # sessions. One of this and trusted_ca_path is required when listening.
    authorized_keys_path: ""
    # CA public keys whose user certificates may register. A certificate must
    # name the claimed proxy id as a principal.
    trusted_ca_path: ""
    # How often the hub pings a registration. Optional.
    keepalive_interval: 10s

auth:
  # user -> proxy authentication (docs/PLAN.md §4.1).
  user:
    # Enabled methods. This is a set, not an order: the proxy always tries
    # certificates first and falls back to password + out-of-band MFA. Drop
    # "password-mfa" for a certificate-only proxy; an empty list is rejected.
    # Optional; defaults to both.
    methods: ["cert", "password-mfa"]
    # How the proxy waits for an out-of-band second factor. The management
    # server states the polling interval and the expiry; these only bound how
    # the proxy behaves while obeying them. All optional.
    mfa:
      # Floor on the server's requested polling interval.
      min_poll_interval: 500ms
      # How often the user is told the proxy is still waiting.
      progress_interval: 5s
      # Cap on the total wait. The server's expiry wins when it is sooner.
      max_wait: 2m
  # proxy -> target authentication (docs/PLAN.md §4.2).
  target:
    # Since contract v2 (phase 0006) Hoplock Control picks the method per route
    # in the authorize response's `target_auth` (D6a) — one proxy commonly
    # fronts hosts that accept just-in-time provisioning and appliances that
    # cannot. What stays here is the local material each method needs, plus this
    # FALLBACK, used only when the server sends no `target_auth` at all.
    #
    # "static-key" is the phase-0005 PLACEHOLDER: one preloaded key for every
    # session on every target, provisioning nothing and expiring nothing. It is
    # for development topologies only. The two production methods are
    # "ephemeral-user" (D6) and "brokered-key" (D6a), configured below.
    #
    # Configure every method this proxy may be asked for, not just this one: a
    # route naming a method with no local material here is refused as an outage,
    # never served with a different credential than the server chose.
    method: "static-key"
    static_key:
      # Private key the proxy logs into targets with. Never commit a real key.
      key_path: "/etc/hoplock/target_key"
      # Log into every target as this account when the route names none.
      # Empty means the route MUST name one — this method reads the route's
      # username parameter like every other, and refuses when neither names an
      # account (phase 0028).
      username: ""

    # ephemeral-user (D6, PLAN §5.1): the proxy logs in with a management
    # certificate, creates a short-lived account and key for the session, and
    # removes both afterwards. Everything here is LOCAL MATERIAL — which key,
    # which privileged account, what the created accounts look like.
    ephemeral_user:
      # Private key of the management certificate, preloaded on targets as an
      # authorized key for provisioning_user. Required for this method.
      management_key_path: "/etc/hoplock/management_key"
      # Optional OpenSSH certificate presented with that key, for fleets that
      # trust a CA rather than a key — which is how this is meant to be
      # deployed: rotating the proxy's credential then touches no target.
      management_cert_path: ""
      # The privileged account on the target. Required for this method.
      provisioning_user: "hoplock-admin"
      # The remote command the provisioning scripts are handed to. Set it to
      # "sudo -n sh -c" when provisioning_user is not root, so the whole script
      # runs inside one privileged shell.
      shell: "sh -c"
      # Parent directory of ephemeral home directories.
      home_base: "/home"
      # Login shell given to ephemeral accounts. A session whose route names an
      # enforcement rung that renders a command dispatcher gets the dispatcher
      # as its login shell instead (docs/PLAN.md §6.5), so this is the shell for
      # the sessions no rung confines.
      target_shell: "/bin/sh"
      # Parent directory of the per-account confinement material an enforcement
      # rung renders on the target: the command dispatcher and the curated PATH
      # directory. It is deliberately OUTSIDE the account's home — under the
      # `account-confined` rung the home is mounted noexec, so a dispatcher
      # living in it could not be executed, and one the account could write
      # would not be an allow-list.
      # It also holds the uid high-water mark (below), which is why it must
      # exist and be writable by the provisioning account even on a fleet that
      # renders no enforcement rung at all.
      enforcement_base: "/var/lib/hoplock"
      # The DEDICATED uid range ephemeral accounts are allocated from (phase
      # 0027). Leave both at 0 for the defaults, 2000000-2999999.
      #
      # This is not tuning. `useradd` with no explicit uid hands a torn-down
      # account's uid straight back to the next caller, and teardown removes an
      # account's home but deliberately never walks the filesystem — so every
      # file a session wrote OUTSIDE its home keeps the bare number, and the next
      # session, belonging to a DIFFERENT PERSON, would own it. The proxy
      # therefore chooses the uid itself, strictly above everything the target has
      # ever handed out, and records the mark under enforcement_base so the
      # guarantee survives a teardown, a restart, and a second proxy.
      #
      # The defaults sit above every distribution's own UID_MAX, so an ephemeral
      # account can never be handed a uid the fleet's own allocator would also
      # hand out. Move them only for a fleet that already allocates there, and
      # keep the range WIDE: allocation does not wrap. Reaching the top refuses
      # every ephemeral session on that target — an outage, disclosed to the user
      # as one — until uid_max is raised, and every allocation past nine tenths of
      # the range warns in the proxy log so that raising it is still a cheap
      # change when it matters.
      uid_min: 0
      uid_max: 0
      # Write OpenSSH's expiry-time restriction into the ephemeral
      # authorized_keys entry when a route asks for a lifetime. Set it to false
      # only for a fleet whose sshd predates 8.2: a route that then asks for a
      # lifetime is REFUSED rather than served with a key that never expires.
      key_expiry: true
      # Bounds one management login and the script it runs.
      timeout: 30s
      # The orphan reaper (PLAN §5.1). It removes accounts left behind by
      # sessions whose proxy died before teardown could run.
      reaper:
        # How often every target this proxy has provisioned on is swept.
        # Negative disables background sweeping entirely.
        interval: 10m
        # How old an untracked ephemeral account must be before a sweep removes
        # it. This is what protects a session the proxy does not know about yet
        # — one being provisioned right now, or one belonging to another
        # process using this proxy id. Minutes, not seconds.
        grace: 30m

    # Containment for a credential the TARGET refuses (prompt 0025).
    #
    # A decrypting proxy is a SINGLE SOURCE ADDRESS to every target it fronts,
    # so a target's per-source abuse defences — OpenSSH 9.8's
    # PerSourcePenalties, on by default — score one route's stale credential
    # against the proxy rather than against the user who happened to trigger it.
    # Retried at whatever rate users arrive, one wrong key ends with the target
    # refusing to answer the proxy at all, and every other user of that target
    # loses a working session to a credential that was never theirs. See
    # README.md, "Target prerequisites", for the target side of this.
    #
    # This is SELF-PROTECTION and not policy (D2): it can only make the proxy
    # attempt less than Hoplock Control authorised, never more, and it never
    # turns a denial into an allow. A session it stops is an outage.
    #
    # Scored per (target, method, credential) — never per user or per route: a
    # wrong credential is wrong for everybody, and a right one keeps working
    # while another one is failing. All three settings are optional.
    rejection:
      # Consecutive rejections of one credential on one target, inside `window`,
      # that stop the proxy attempting it. Default 5. Set it to 0 — and only
      # deliberately — to disable containment entirely.
      threshold: 5
      # How long a run of rejections counts as consecutive. A rejection arriving
      # after this starts a run of its own, so a slow trickle never accumulates.
      # Default 5m.
      window: 5m
      # How long the credential is withheld once the threshold is reached. The
      # first success afterwards closes it and resets the count. Default 5m.
      cooldown: 5m

    # brokered-key (D6a, PLAN §5.2): a credential held in memory for the
    # session and never written to disk, for the appliances, network gear, and
    # OT devices the proxy cannot administer. The target is not modified.
    brokered_key:
      # Where this proxy's local material lives: "dir" or "env". The route's
      # credential_ref selects which entry — it is an opaque handle and never
      # carries material itself.
      source: "dir"
      # Log into brokered targets as this account when the route names none.
      # Empty means the route MUST name one: there is no fallback to what the
      # user typed at their SSH client, and a route that names no account on a
      # proxy that configures none is refused as an outage (phase 0028).
      username: ""
      # dir source: one file per reference, "<dir>/<ref><file_suffix>".
      dir: "/etc/hoplock/brokered"
      file_suffix: ".key"
      # env source: the variable is "<env_prefix><REF>", upper-cased.
      env_prefix: "HOPLOCK_BROKERED_"

    # ephemeral-account (D13, PLAN §5.3): a short-lived ADMINISTRATOR on a
    # device the proxy cannot administer as a host. A FortiGate cannot run
    # useradd and has no authorized_keys, but it can create an administrator,
    # scope it to an access profile, restrict it to a source address, and delete
    # it again — the same operations, in the platform's own vocabulary, through
    # a driver for the platform the route NAMES. Nothing is inferred from a
    # banner: guessing wrong runs configuration commands against the wrong
    # parser, on a device that is somebody's production network.
    ephemeral_account:
      # The privileged administrator this proxy logs into devices as. It needs
      # rights to create and delete administrators, and nothing else.
      admin_user: "hoplock-mgmt"
      # Its password comes from the ENVIRONMENT, named here. The password is
      # deliberately not a field in this file: a device management credential in
      # a configuration file is one in a backup, a bug report, and a container
      # image layer.
      password_env: "HOPLOCK_DEVICE_ADMIN_PASSWORD"
      # Or a private key, for devices that hold one for this administrator.
      # Either this or password_env is required.
      key_path: ""
      # The platform drivers this proxy registers, and therefore the platforms
      # it advertises to Hoplock Control. Empty means every driver this build
      # ships. A route naming a platform with no driver is an outage-class
      # denial, never the nearest driver.
      platforms: []
      # The platform authorization scope created administrators are given.
      # REQUIRED: no driver in this build has a default, and the proxy refuses
      # to start without one rather than choosing a privileged account's scope
      # on your firewalls for you.
      #
      # FortiOS documents three built-in profiles: `super_admin` and
      # `prof_admin` (read-write) and `super_admin_readonly` (read-only,
      # immutable, and not shown under System > Admin profiles in the GUI).
      # Two things to know before picking one:
      #
      #   * `super_admin_readonly` cannot run `diagnose` commands from FortiOS
      #     7.4.x, so it is narrower than "read-only" suggests. Fortinet's own
      #     answer for a read-only account that must troubleshoot is a custom
      #     profile with CLI commands permitted.
      #   * a read-only profile is wrong for any route whose purpose is to
      #     CHANGE the device, which is most privileged-access work.
      #
      # WHICH profile a route gets is a policy question that phase 0018 gives a
      # vocabulary and phase 0019 applies; this proxy-wide setting is what that
      # replaces.
      access_profile: "super_admin_readonly"
      #
      # One consequence to know before choosing it (phase 0016): on a FortiGate
      # running virtual domains, a VDOM-SCOPED administrator may hold only
      # `prof_admin` or a custom profile — `super_admin_readonly` is the GLOBAL
      # read-only profile and FortiOS will not accept it there. There is no
      # built-in read-only profile a per-VDOM account can hold, so a proxy
      # serving routes that name `device_field.vdom` needs either `prof_admin`
      # or, better, a custom profile the customer built. The driver refuses the
      # global built-ins for such a route rather than letting the device fail
      # the sequence half way through.
      # The address devices see this proxy connect from. Where a driver declares
      # it can pin an account to a source address, this is what it is pinned to.
      # Empty means no pin — a restriction not applied, rather than one applied
      # loosely.
      source_address: ""
      # The orphan sweep. Its defaults (2m/10m) are TIGHTER than the POSIX
      # method's, and that is the point: no device platform this build has a
      # driver for can expire an account by itself, so the sweep is the primary
      # removal path rather than a backstop for a crashed proxy.
      reaper:
        interval: "2m"
        grace: "10m"
