# The full end-to-end topology (docs/PLAN.md §9): every node of the system, on
# Docker networks that make the segmentation claims true rather than asserted.
#
# Node roles:
#   control        the mock Hoplock Control — every decision comes from here
#   user           the SSH client the scenario suite drives
#   proxy-direct   an edge proxy that reaches the target itself
#   proxy-nexthop  an edge proxy that reaches the target only by chaining
#   proxy-zone     a proxy in a protected zone: it accepts NO inbound
#                  connection from any network and reaches its upstream over an
#                  outbound relay registration (D11)
#   target         a real sshd, with the prerequisites both credential methods
#                  need (D6, D6a)
#   device         a fake FortiOS appliance (cmd/fake-device): a CLI over SSH
#                  with no useradd and no authorized_keys, which is what the
#                  ephemeral-account method exists for (D13)
#
# Networks, and what each one is load-bearing for:
#   edge   user ↔ the two reachable proxies ↔ control
#   core   the proxies that may reach the target ↔ target ↔ control. It is
#          `internal`, and the user node is NOT on it: the target is reachable
#          only through a proxy, which is the claim the whole topology exists
#          to make checkable.
#   relay  proxy-zone's outbound path to proxy-nexthop's registration
#          listener, and nothing else.
#
# proxy-nexthop is deliberately absent from `core`. A chained session that
# reached the target therefore travelled through a second proxy — it could not
# have been served locally.

services:
  control:
    build:
      context: .
      dockerfile: control/Dockerfile
    command:
      - "-listen"
      - "0.0.0.0:8080"
      - "-fixtures"
      - "/etc/hoplock/fixtures.yaml"
      - "-log-dir"
      - "/var/log/hoplock"
    volumes:
      - ./control/fixtures.yaml:/etc/hoplock/fixtures.yaml:ro
    networks: [edge, core]
    ports:
      # The scenario suite reads /debug/logs from the host. Bound to loopback:
      # this is a test fixture, not a service.
      - "127.0.0.1:18080:8080"

  target:
    build:
      context: .
      dockerfile: target/Dockerfile
    volumes:
      - ./keys:/material:ro
    networks: [core]
    # The kernel privileges phase 0019's enforcement rungs need on a target:
    # NET_ADMIN for the per-uid packet filter (the reach axis) and SYS_ADMIN for
    # the noexec,nosuid,nodev bind mount (the second half of account-confined).
    # Without them the capability probe reports the rungs as unavailable and a
    # route naming one is refused as an outage — which is the behaviour the
    # `enforcement` scenarios assert, so this list is load-bearing in both
    # directions.
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN

  # The appliance. It is on `core` for the same reason the target is: reachable
  # through a proxy and by nothing else. Its administrator password arrives in
  # the environment rather than in a file, which is also how the proxy reads it
  # — a device management credential in a config file is one in a backup.
  device:
    build:
      context: .
      dockerfile: device/Dockerfile
    command:
      - "-listen"
      - "0.0.0.0:22"
      - "-hostname"
      - "FGT-E2E"
      - "-admin"
      - "hoplock-mgmt"
      - "-debug"
      - "127.0.0.1:8081"
      # The same appliance in a different configuration: a unit running virtual
      # domains, served by a second listener in the SAME container rather than
      # by a node of its own (phase 0016). A multi-VDOM FortiGate is not a
      # second kind of box, and a topology that modelled it as one would be
      # describing an estate nobody has.
      - "-vdom-listen"
      - "0.0.0.0:2222"
      - "-vdom-mode"
      - "multiple"
      - "-vdoms"
      - "root,customer-a"
      - "-vdom-debug"
      - "127.0.0.1:8082"
    environment:
      HOPLOCK_DEVICE_ADMIN_PASSWORD: "e2e-device-admin"
    networks: [core]
    # No published port, and the debug listener is bound to loopback INSIDE the
    # container. `core` is internal, so a published port would not be reachable
    # from the host the scenario suite runs on anyway — and the fix for that
    # must not be to put the appliance on an externally routable network, which
    # is precisely the isolation the device scenarios depend on.
    #
    # The suite reads the administrator table by running the same binary in
    # client mode inside this container (`hoplock-fake-device -dump`), which
    # needs no network of its own and no curl in the image.

  proxy-direct:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    command: ["-config", "/etc/hoplock/config.yaml"]
    environment:
      # The device method reads the appliance administrator's password from the
      # environment, never from its configuration file.
      HOPLOCK_DEVICE_ADMIN_PASSWORD: "e2e-device-admin"
    volumes:
      - ./proxy/proxy-direct.yaml:/etc/hoplock/config.yaml:ro
      - ./keys:/material:ro
    networks: [edge, core]

  proxy-nexthop:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    command: ["-config", "/etc/hoplock/config.yaml"]
    volumes:
      - ./proxy/proxy-nexthop.yaml:/etc/hoplock/config.yaml:ro
      - ./keys:/material:ro
    networks: [edge, relay]

  proxy-zone:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    command: ["-config", "/etc/hoplock/config.yaml"]
    volumes:
      - ./proxy/proxy-zone.yaml:/etc/hoplock/config.yaml:ro
      - ./keys:/material:ro
    # No `ports`, and its SSH listener is bound to loopback inside the
    # container (proxy/proxy-zone.yaml). Nothing on any network can open a
    # connection to it; sessions arrive only over the registration it opened.
    networks: [core, relay]

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    command: ["sleep", "infinity"]
    volumes:
      - ./keys:/material:ro
    # `edge` only. The target is on `core`, so this node cannot reach it by any
    # route other than a proxy.
    networks: [edge]

networks:
  edge:
  core:
    internal: true
  relay:
    internal: true
