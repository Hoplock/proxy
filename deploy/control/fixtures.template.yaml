# Fixtures for the mock Hoplock Control in the end-to-end topology
# (deploy/compose.yaml, docs/PLAN.md §9).
#
# This file is a TEMPLATE: deploy/gen-material.sh renders it to fixtures.yaml
# with the SHA256 fingerprints of the keys it generates. A fingerprint cannot be
# written down before its key exists, which is why neither the keys nor the
# rendered fixtures are committed.
#
# Everything the scenario suite asserts on is decided here. Each route below
# names the scenarios it backs, so a failing scenario leads to one rule rather
# than to a search. The credentials are test data; no real secret belongs here.

proxy_token: "e2e-proxy-token"

users:
  # The interactive user. Certificate-only on purpose even though proxy-direct
  # now offers both methods (phase 0026): she has no password here, so every
  # scenario she appears in is unambiguously the certificate path.
  - login: alice
    identity:
      subject: alice@example.com
      display_name: Alice Example
      source: fixture
      principals: [alice]
      groups: [engineering, sre]
      claims:
        department: platform
    key_fingerprints:
      - "@@FP_USER_ALICE@@"

  # The machine account. It runs commands and never needs a terminal, which is
  # what makes it the right principal for the restricted-exec and forwarding
  # routes below.
  - login: svc-deploy
    identity:
      subject: svc-deploy@example.com
      source: fixture
      groups: [deployers]
    key_fingerprints:
      - "@@FP_USER_SVC@@"

  # ------------------------------------------------- password + MFA (0026) ---
  # Two password users with no key at all, which is what puts them on the
  # fallback method (PLAN §4.1): there is no certificate for them to offer, so
  # the only way in is keyboard-interactive against proxy-direct.
  #
  # Shapes copied from cmd/mock-control/fixtures.example.yaml rather than
  # invented — `bob` is that file's approving user and `mallory` its denying
  # one.

  # Approved, but not immediately. `pending_polls` is what makes the wait real:
  # with 0 the challenge resolves on the first poll and the "still waiting"
  # progress line — the reason this flow is keyboard-interactive rather than
  # plain password auth (PLAN §4.3) — never happens, so the scenario asserting
  # on it would pass against a proxy that had no such line to print. Three
  # polls at proxy-direct's 200ms floor is under a second of wall clock and
  # several progress lines.
  - login: bob
    identity:
      subject: bob@example.com
      display_name: Bob Example
      source: fixture
      principals: [bob]
      groups: [engineering]
    password: "bob-e2e-password"
    mfa:
      required: true
      decision: approve
      pending_polls: 3
      poll_after_ms: 10
      ttl_ms: 60000
      prompt: "Approve the Hoplock Proxy sign-in on your phone."

  # Denied at the second factor, holding a password the server accepts. That
  # combination is the whole point: the deny happens AFTER the first factor
  # succeeded, so a message that named the failing factor would be telling an
  # attacker that the password was right. `mallory` also has a route below for
  # the same reason — nothing about her denial may be explicable as "she was
  # not authorized for that target".
  - login: mallory
    identity:
      subject: mallory@example.com
      source: fixture
    password: "mallory-e2e-password"
    mfa:
      required: true
      decision: deny
      pending_polls: 0
      poll_after_ms: 10
      ttl_ms: 60000
      prompt: "Approve the Hoplock Proxy sign-in on your phone."

# The fleet's own proxies, recognised by the key one presents when it extends a
# chain to the next (D11). The identity the far hop is answered with is still
# the user's, established here — no hop takes another hop's word for who is
# connecting (docs/PLAN.md §6.1).
proxies:
  - id: proxy-direct
    key_fingerprints:
      - "@@FP_CHAIN_DIRECT@@"
  - id: proxy-nexthop
    key_fingerprints:
      - "@@FP_CHAIN_NEXTHOP@@"
  - id: proxy-zone
    key_fingerprints:
      - "@@FP_CHAIN_ZONE@@"

routes:
  # ---------------------------------------------------------------- direct ---
  # The everyday route: a Linux host reached directly, with just-in-time
  # accounts (D6). Scenarios: direct exec, interactive shell, sftp denied while
  # shell succeeds, the four filter actions, tcpip-forward refused, ephemeral
  # user created and removed, batched + priority logs, and the outage path when
  # this server is stopped.
  - login: alice
    target: host.company.com
    proxy_id: proxy-direct
    route_type: direct
    resolved_target: target
    target_port: 22
    permissions: readOnlyGroup
    permitted_channels: [session]
    # Axis 2 (D5a): sftp is denied by name while the shell stays. The channel
    # allow-list above cannot express that — both ride `session`.
    permitted_requests:
      types: [pty-req, shell, exec, env]
      subsystems: []
    # Axis 3 (D5a): an empty list is a deny, and this is what "may never open a
    # listener" looks like. Remote forwarding is a connection-level request, so
    # the channel allow-list never sees it.
    permitted_global_requests:
      types: []
    target_auth:
      method: ephemeral-user
      params:
        # Required since contract v3 on every provisioning method (0013). It
        # used to default to the identity's login; a login is a client-typed
        # string and must never name an account on a target.
        username: alice
        key_type: ed25519
        lifetime_seconds: "900"
    filter_policy:
      # One policy, three of the four actions, each on its own rule. Neither
      # `reboot` nor `shutdown` exists on the target image, so a rule that
      # failed to fire could not do damage — the assertion is the proxy's own
      # answer, not the absence of a crater.
      mode: blacklist
      rules:
        - match: "reboot*"
          action: block_command
          message: "Reboots go through the change process."
        - match: "shutdown*"
          action: kill_session
          message: "Destructive command. This session has been terminated."
        - match: "sudo *"
          action: warn_and_continue
          message: "Privileged command — this is recorded."

  # ----------------------------------------------- password + MFA (0026) ---
  # The same Linux host, reached by the two password users. The route is a copy
  # of the one above with a different login: the point of these two is the
  # AUTHENTICATION method, so everything downstream of it stays identical and
  # a difference in outcome can only have come from the method.
  #
  # Scenarios: an MFA approval reaches a shell and runs a command, the user is
  # shown the challenge and at least one progress line, and the session is
  # attributed to `password-mfa` in the audit trail.
  - login: bob
    target: host.company.com
    proxy_id: proxy-direct
    route_type: direct
    resolved_target: target
    target_port: 22
    permissions: readOnlyGroup
    permitted_channels: [session]
    permitted_requests:
      types: [pty-req, shell, exec, env]
      subsystems: []
    permitted_global_requests:
      types: []
    target_auth:
      method: ephemeral-user
      params:
        username: bob
        key_type: ed25519
        lifetime_seconds: "900"

  # Mallory is authorized for exactly the same thing, and never gets there: her
  # second factor is refused. The route exists so that the denial scenario has
  # nothing else to attribute the refusal to — an unrouted login would be denied
  # by authorization, which is a different assertion wearing the same message.
  #
  # Scenario: MFA denial discloses no factor.
  - login: mallory
    target: host.company.com
    proxy_id: proxy-direct
    route_type: direct
    resolved_target: target
    target_port: 22
    permissions: readOnlyGroup
    permitted_channels: [session]
    permitted_requests:
      types: [pty-req, shell, exec, env]
      subsystems: []
    permitted_global_requests:
      types: []
    target_auth:
      method: ephemeral-user
      params:
        username: mallory
        key_type: ed25519
        lifetime_seconds: "900"

  # ------------------------------------------------ uid allocation (0027) ---
  # The SAME Linux host, reached by the machine account. It exists so the uid
  # scenarios have TWO LOGINS on one target with no enforcement rung between
  # them: the claim is that a second person's session does not inherit ownership
  # of what the first one wrote, and a rung that confined either of them would
  # make the result unattributable to allocation.
  #
  # No filter policy on purpose. The scenario reads and writes files in /tmp and
  # asks the target for uids, and a blacklist rule firing on one of those would
  # be a different assertion wearing the same failure.
  #
  # Scenarios: two sequential sessions get different uids; a file one session
  # wrote outside its home is not owned by the next session's account.
  - login: svc-deploy
    target: inherit.company.com
    proxy_id: proxy-direct
    route_type: direct
    resolved_target: target
    target_port: 22
    permissions: readOnlyGroup
    permitted_channels: [session]
    permitted_requests:
      types: [pty-req, shell, exec, env]
      subsystems: []
    permitted_global_requests:
      types: []
    target_auth:
      method: ephemeral-user
      params:
        username: svc-deploy
        key_type: ed25519
        lifetime_seconds: "900"

  # ------------------------------------------------- ephemeral-account ---
  # An appliance: a CLI over SSH with no useradd, no authorized_keys and no home
  # directory (D13, PLAN §5.3). The proxy creates a short-lived ADMINISTRATOR on
  # it through the FortiGate driver and removes it when the session ends.
  #
  # The ladder has one entry on purpose: this route is where a PDP has decided
  # that a device account is the only acceptable credential, which since D14 is
  # what a one-entry ladder means and is exactly D6a's original behaviour.
  #
  # Scenarios: device session, device account created and removed.
  - login: alice
    target: fortigate.company.com
    proxy_id: proxy-direct
    route_type: direct
    resolved_target: device
    target_port: 22
    permissions: networkAdminGroup
    permitted_channels: [session]
    permitted_requests:
      types: [pty-req, shell, exec, env]
      subsystems: []
    target_auth_ladder:
      - method: ephemeral-account
        params:
          username: alice
          # Never inferred from a banner: guessing wrong runs configuration
          # commands against the wrong parser (D13).
          platform: fortigate
          credential_kind: password
          # FortiOS has no per-administrator expiry field, so the proxy holds
          # the deadline. A route asking for target-enforced here would be a
          # skipped rung rather than a session served on a promise nobody keeps.
          expiry_posture: proxy-enforced
          lifetime_seconds: "900"

  # ------------------------------------- ephemeral-account, partitioned ---
  # The SAME appliance, running virtual domains (phase 0016). It is a second
  # listener on the device node rather than a second node, because a multi-VDOM
  # FortiGate is one box partitioned — which is the whole reason the VDOM is a
  # route FIELD and not part of the target: `device:2222` is what DNS resolves
  # and what the host key is pinned to, and one unit holding many virtual
  # domains is still one unit to both.
  #
  # Scenario: a session to a partitioned unit, scoped to one virtual domain.
  - login: alice
    target: fortigate-vdom.company.com
    proxy_id: proxy-direct
    route_type: direct
    resolved_target: device
    target_port: 2222
    permissions: networkAdminGroup
    permitted_channels: [session]
    permitted_requests:
      types: [pty-req, shell, exec, env]
      subsystems: []
    target_auth_ladder:
      - method: ephemeral-account
        params:
          username: alice
          platform: fortigate
          credential_kind: password
          expiry_posture: proxy-enforced
          lifetime_seconds: "900"
          # Contract v3.1: the administrator is created INSIDE this virtual
          # domain rather than at the unit's global scope. Absent, the same
          # route would get a global administrator — the wider of the two — so
          # this line is a narrowing somebody wrote down.
          device_field.vdom: customer-a

  # The ladder's fall-through (D14). The first entry names a platform this proxy
  # has no driver for, so it is UNSATISFIABLE and skipped; the second is served.
  # A session that does not happen produces no recording and no audit trail, and
  # for a product whose first claim is reaching the gear nothing else reaches,
  # denial is frequently the worse security outcome.
  #
  # Scenario: ladder fall-through.
  - login: alice
    target: ladder.company.com
    proxy_id: proxy-direct
    route_type: direct
    resolved_target: target
    target_port: 22
    permissions: readOnlyGroup
    permitted_channels: [session]
    permitted_requests:
      types: [pty-req, shell, exec, env]
      subsystems: []
    target_auth_ladder:
      - method: ephemeral-account
        params:
          username: alice
          platform: some-other-vendor
          credential_kind: password
          expiry_posture: proxy-enforced
          lifetime_seconds: "900"
      - method: brokered-key
        params:
          username: netadmin
          credential_ref: appliance-fleet

  # A session the server bounds in time (D16, phase 0024). Scenarios: the user
  # is warned and then told the session reached its authorized end; the exit
  # status distinguishes it from a policy kill; the ephemeral account is gone
  # afterwards; a backgrounded process on the target does not survive it; and
  # the same happens with this server stopped, because the proxy enforces the
  # deadline locally.
  #
  # `ephemeral-user` on purpose: the account-removal and detached-process
  # assertions need an account to have been created. The deadline is short
  # enough for a test suite and long enough to survive a loaded CI runner
  # setting a session up and stopping a container — the proxies' own
  # `session.deadline_warning` is what makes the warning fall inside it.
  - login: alice
    target: expiring.company.com
    proxy_id: proxy-direct
    route_type: direct
    resolved_target: target
    target_port: 22
    permissions: readOnlyGroup
    permitted_channels: [session]
    permitted_requests:
      types: [pty-req, shell, exec, env]
      subsystems: []
    session_deadline_seconds: 30
    target_auth:
      method: ephemeral-user
      params:
        username: alice
        key_type: ed25519
        lifetime_seconds: "900"
    filter_policy:
      mode: blacklist

  # Axis 2, the other way round: commands are allowed and a terminal is not.
  # Scenario: `ssh -tt host cmd` is refused, `ssh host cmd` succeeds.
  - login: alice
    target: nopty.company.com
    proxy_id: proxy-direct
    route_type: direct
    resolved_target: target
    target_port: 22
    permissions: readOnlyGroup
    permitted_channels: [session]
    permitted_requests:
      types: [exec]
      subsystems: []
    target_auth:
      method: brokered-key
      params:
        username: netadmin
        credential_ref: appliance-fleet
    filter_policy:
      mode: blacklist

  # Axis 1: an empty channel allow-list. Scenario: the session channel itself
  # is refused, and the client is told which channel type, and nothing else.
  - login: alice
    target: nochan.company.com
    proxy_id: proxy-direct
    route_type: direct
    resolved_target: target
    target_port: 22
    permissions: readOnlyGroup
    permitted_channels: []
    # A working credential on purpose: the refusal this route exists to
    # demonstrate must be the channel policy, not a session that never got as
    # far as one.
    target_auth:
      method: brokered-key
      params:
        username: netadmin
        credential_ref: appliance-fleet
    filter_policy:
      mode: blacklist

  # ------------------------------------ refused target credential (0025) ---
  # A route whose brokered credential the target does NOT accept:
  # `stale-fleet` is generated by deploy/gen-material.sh and its public half is
  # installed nowhere. It stands in for the everyday fault — a key rotated on
  # the estate and not in the broker — and it is the ONLY route that names it,
  # so the breaker it opens can never withhold anything else.
  #
  # Scenarios: a refused credential is an outage naming a refused credential
  # (not "the target could not be reached", not "Access denied."); it is
  # recorded critically; after the threshold the target sees no new connection;
  # and `appliance.company.com` — a different credential to the SAME target —
  # keeps working throughout.
  - login: alice
    target: refused.company.com
    proxy_id: proxy-direct
    route_type: direct
    resolved_target: target
    target_port: 22
    permissions: readOnlyGroup
    permitted_channels: [session]
    permitted_requests:
      types: [pty-req, shell, exec, env]
      subsystems: []
    target_auth:
      method: brokered-key
      params:
        username: netadmin
        credential_ref: stale-fleet
    filter_policy:
      mode: blacklist

  # ------------------------------------------ no account name at all (0028) ---
  # The route that names NO target_auth, served by the one proxy that also
  # configures no local account (deploy/proxy/proxy-nexthop.yaml). Since
  # contract v4.2 a brokered-key route must carry its own `username`, so this
  # v1-shaped route — "use whatever method the proxy is configured for" — is the
  # only remaining way for a session to arrive with no account name available
  # anywhere.
  #
  # It must fail as an OUTAGE and not as a denial: nobody decided alice may not
  # reach this target, the estate could not say who to log in as. Before phase
  # 0028 it would have logged in as "alice", because that is the string she
  # typed at her SSH client.
  #
  # `resolved_target` deliberately points at the real target, so a session that
  # got past the refusal would reach a host that is up and answering — a green
  # run here means the refusal happened, not that the connection failed anyway.
  - login: alice
    target: unnamed.company.com
    proxy_id: proxy-nexthop
    route_type: direct
    resolved_target: target
    target_port: 22
    permissions: readOnlyGroup
    permitted_channels: [session]
    permitted_requests:
      types: [exec]
      subsystems: []
    filter_policy:
      mode: blacklist

  # --------------------------------------------------------------- nexthop ---
  # Chained in `dial` mode: the edge proxy opens the leg to the next hop, which
  # therefore needs an inbound rule. Both hops run the whole flow for
  # themselves; the far end's answer is the rule below it.
  - login: alice
    target: deep.company.com
    proxy_id: proxy-nexthop
    route_type: nexthop
    next_hop: proxy-direct
    target_port: 2222
    hop_connection: dial
    next_proxy_id: proxy-direct
    max_hops: 3
    permissions: readOnlyGroup
    permitted_channels: [session]
    permitted_requests:
      types: [pty-req, shell, exec, env]
      subsystems: []
    filter_policy:
      mode: blacklist

  - login: alice
    target: deep.company.com
    proxy_id: proxy-direct
    route_type: direct
    resolved_target: target
    target_port: 22
    permissions: readOnlyGroup
    permitted_channels: [session]
    permitted_requests:
      types: [pty-req, shell, exec, env]
      subsystems: []
    target_auth:
      method: ephemeral-user
      params:
        # Required since contract v3 (0013).
        username: alice
        key_type: ed25519
    filter_policy:
      mode: blacklist

  # Chained in `relay` mode (D11): proxy-zone has registered an OUTBOUND
  # connection with proxy-nexthop, which opens a channel over it. The protected
  # zone needs no inbound rule at all — and `next_hop` below is a name that
  # cannot resolve, so a session that arrives has provably travelled over the
  # registration rather than over a dial.
  - login: alice
    target: zone.company.com
    proxy_id: proxy-nexthop
    route_type: nexthop
    next_hop: proxy-zone.no-inbound.invalid
    target_port: 22
    hop_connection: relay
    next_proxy_id: proxy-zone
    max_hops: 3
    permissions: readOnlyGroup
    permitted_channels: [session]
    permitted_requests:
      types: [pty-req, shell, exec, env]
      subsystems: []
    filter_policy:
      mode: blacklist

  - login: alice
    target: zone.company.com
    proxy_id: proxy-zone
    route_type: direct
    resolved_target: target
    target_port: 22
    permissions: readOnlyGroup
    permitted_channels: [session]
    permitted_requests:
      types: [pty-req, shell, exec, env]
      subsystems: []
    target_auth:
      method: ephemeral-user
      params:
        # Required since contract v3 (0013).
        username: alice
        key_type: ed25519
    filter_policy:
      mode: blacklist

  # A relay hop naming a registration that does not exist. `next_hop` is the
  # address of a proxy that IS dialable and would serve this session happily —
  # so a proxy that quietly downgraded a relay hop to a dial would pass. It is
  # refused as an outage instead.
  - login: alice
    target: ghost.company.com
    proxy_id: proxy-nexthop
    route_type: nexthop
    next_hop: proxy-direct
    target_port: 2222
    hop_connection: relay
    next_proxy_id: proxy-absent
    permissions: readOnlyGroup
    permitted_channels: [session]
    filter_policy:
      mode: blacklist

  # A loop: the far hop routes straight back to the proxy the session came
  # from. Neither proxy can see the whole chain; the hop trail is what makes
  # this detectable at all.
  - login: alice
    target: loop.company.com
    proxy_id: proxy-nexthop
    route_type: nexthop
    next_hop: proxy-direct
    target_port: 2222
    hop_connection: dial
    next_proxy_id: proxy-direct
    permissions: readOnlyGroup
    permitted_channels: [session]
    filter_policy:
      mode: blacklist

  - login: alice
    target: loop.company.com
    proxy_id: proxy-direct
    route_type: nexthop
    next_hop: proxy-nexthop
    target_port: 2222
    hop_connection: dial
    next_proxy_id: proxy-nexthop
    permissions: readOnlyGroup
    permitted_channels: [session]
    filter_policy:
      mode: blacklist

  # The hop cap: one hop is all this route allows, and extending the chain
  # would need two.
  - login: alice
    target: hopcap.company.com
    proxy_id: proxy-nexthop
    route_type: nexthop
    next_hop: proxy-direct
    target_port: 2222
    hop_connection: dial
    next_proxy_id: proxy-direct
    max_hops: 1
    permissions: readOnlyGroup
    permitted_channels: [session]
    filter_policy:
      mode: blacklist

  # ------------------------------------------------------------ svc-deploy ---
  # Forwarding destinations (D5a, axis 2 for direct-tcpip): the tunnel may
  # reach exactly one host and port. Allowing the channel type alone would
  # permit tunnelling anywhere, which is the whole point of this axis.
  - login: svc-deploy
    target: fwd.company.com
    proxy_id: proxy-direct
    route_type: direct
    resolved_target: target
    target_port: 22
    permissions: deployGroup
    permitted_channels: [session, direct-tcpip]
    permitted_requests:
      types: [exec]
      subsystems: []
    permitted_forwards:
      direct_tcpip:
        - host: target
          port: 22
      # The target may not open forwards back at all.
      forwarded_tcpip: []
    target_auth:
      method: brokered-key
      params:
        username: netadmin
        credential_ref: appliance-fleet
    filter_policy:
      mode: blacklist

  # RESTRICTED exec (D12, the enforced tier): the command is parsed into an
  # argument vector and must be covered completely by one entry, or it is
  # denied. Nothing is passed through a shell to be re-expanded — which is what
  # the filtered route below cannot say about itself.
  - login: svc-deploy
    target: appliance.company.com
    proxy_id: proxy-direct
    route_type: direct
    resolved_target: target
    target_port: 22
    permissions: applianceReadOnly
    permitted_channels: [session]
    permitted_requests:
      types: [exec]
      subsystems: []
    target_auth:
      method: brokered-key
      params:
        username: netadmin
        credential_ref: appliance-fleet
    filter_policy:
      mode: whitelist
      exec_mode: restricted
      restricted_exec:
        commands:
          - executable: /bin/uptime
            form: exact
            argv: []
          - executable: /bin/echo
            form: positional
            args:
              - kind: any

  # FILTERED exec (D12, the guardrail tier) on the same estate. The pattern
  # rules are anchored on the whole command, so the shell wrapper the
  # restricted route denies gets past here. The two tiers are demonstrably
  # different things, in the product and not only in unit tests.
  - login: svc-deploy
    target: filtered.company.com
    proxy_id: proxy-direct
    route_type: direct
    resolved_target: target
    target_port: 22
    permissions: deployGroup
    permitted_channels: [session]
    permitted_requests:
      types: [exec]
      subsystems: []
    target_auth:
      method: brokered-key
      params:
        username: netadmin
        credential_ref: appliance-fleet
    filter_policy:
      mode: blacklist
      rules:
        - match: "/bin/ls *"
          action: block_command
          message: "Directory listings are not permitted from this account."

  # The fourth action, and the other filter mode: a whitelist, where anything
  # no rule matched is blocked by the mode itself.
  - login: svc-deploy
    target: allowlist.company.com
    proxy_id: proxy-direct
    route_type: direct
    resolved_target: target
    target_port: 22
    permissions: deployGroup
    permitted_channels: [session]
    permitted_requests:
      types: [exec]
      subsystems: []
    target_auth:
      method: brokered-key
      params:
        username: netadmin
        credential_ref: appliance-fleet
    filter_policy:
      mode: whitelist
      rules:
        - match: "/bin/echo *"
          action: allow_and_log

  # ------------------------------------ overlapping brokered sessions (0026) ---
  # A standing account on the brokered estate, with a policy that permits a
  # command long enough to hold the session open. It is a route of its own
  # rather than a reuse of one above because every other brokered route here
  # constrains what may run — `appliance.company.com` to two exact binaries,
  # `filtered.company.com` and `allowlist.company.com` to their own patterns —
  # and a scenario about the CREDENTIAL should not have to satisfy a command
  # filter to make its point.
  #
  # Scenario: two overlapping brokered sessions share the one standing account,
  # both succeed, and the target is byte-identical afterwards. That is the
  # opposite of the ephemeral case by design (D6a, PLAN §5.2): nothing is
  # created, so there is nothing for two sessions to collide over.
  - login: svc-deploy
    target: standing.company.com
    proxy_id: proxy-direct
    route_type: direct
    resolved_target: target
    target_port: 22
    permissions: deployGroup
    permitted_channels: [session]
    permitted_requests:
      types: [exec]
      subsystems: []
    target_auth:
      method: brokered-key
      params:
        username: netadmin
        credential_ref: appliance-fleet
    filter_policy:
      mode: blacklist

  # ------------------------------------------- target-side enforcement (0019) ---
  # The rungs of docs/PLAN.md §6.5, rendered onto the ephemeral account rather
  # than enforced on a string in flight. Everything above this block is enforced
  # by the PROXY, at the exec request or the channel open; everything in it is
  # enforced by sshd and the kernel, where it also holds for a connection that
  # never came through the proxy.
  #
  # UC2 exactly: an automation account that may run TWO BINARIES and reach ONE
  # DESTINATION. The two axes are independent and this route sets both.
  - login: svc-deploy
    target: confined.company.com
    proxy_id: proxy-direct
    route_type: direct
    resolved_target: target
    target_port: 22
    permissions: automationGroup
    permitted_channels: [session]
    permitted_requests:
      types: [exec]
      subsystems: []
    target_auth:
      method: ephemeral-user
      params:
        username: svc-deploy
        key_type: ed25519
    enforcement:
      # The allow-list below is rendered into an authorized_keys `command=`
      # dispatcher on the account, so it holds for every login to it.
      execution: account-restricted
      # The half `permitted_forwards` cannot express: a process this session
      # starts opens its own sockets and never touches an SSH channel, so the
      # proxy never sees it. Loopback is NOT permitted unless the policy names
      # it, and this policy names exactly one destination.
      reach: account-egress-restricted
      permitted_destinations:
        - host: 127.0.0.1
          port: 22
    filter_policy:
      # The contract requires the enforced tier beside an account rung: it is
      # the only place the vocabulary names an executable, and the rung renders
      # THIS list rather than authoring one of its own.
      mode: whitelist
      exec_mode: restricted
      restricted_exec:
        commands:
          - executable: uptime
            form: exact
            argv: []
          # A bare name rather than a path, deliberately: it is resolved on the
          # target into the curated PATH directory the rung builds, which is
          # the guardrail half of the mechanism.
          - executable: nc
            form: positional
            args:
              - kind: literal
                value: "-z"
              - kind: literal
                value: "-w"
              - kind: literal
                value: "2"
              - kind: any
              - kind: any

  # The strongest pair on both axes: nothing the session wrote may execute, no
  # privilege may be gained, and nothing off the host may be reached.
  - login: svc-deploy
    target: isolated.company.com
    proxy_id: proxy-direct
    route_type: direct
    resolved_target: target
    target_port: 22
    permissions: automationGroup
    permitted_channels: [session]
    permitted_requests:
      types: [exec]
      subsystems: []
    target_auth:
      method: ephemeral-user
      params:
        username: svc-deploy
        key_type: ed25519
    enforcement:
      execution: account-confined
      reach: account-network-isolated
    filter_policy:
      mode: whitelist
      exec_mode: restricted
      restricted_exec:
        commands:
          - executable: uptime
            form: exact
            argv: []
          - executable: nc
            form: positional
            args:
              - kind: literal
                value: "-z"
              - kind: literal
                value: "-w"
              - kind: literal
                value: "2"
              - kind: any
              - kind: any

  # An ATTESTED rung on a brokered-key route: the target is unmodifiable by
  # definition (D6a), the proxy configures nothing, and the session is still
  # recorded at a real rung rather than at "none". The attestation is what makes
  # that claim attributable — the record also says this system verified neither.
  - login: svc-deploy
    target: attested.company.com
    proxy_id: proxy-direct
    route_type: direct
    resolved_target: target
    target_port: 22
    permissions: applianceReadOnly
    permitted_channels: [session]
    permitted_requests:
      types: [exec]
      subsystems: []
    target_auth:
      method: brokered-key
      params:
        username: netadmin
        credential_ref: appliance-fleet
    enforcement:
      execution: platform-attested
      reach: platform-attested
      attestation:
        asserted_by: network-engineering
        reference: "NET-BASELINE-7.2 §4 (appliance RBAC + per-account ACL)"
        asserted_at: "2026-07-01T00:00:00Z"
    filter_policy:
      mode: blacklist

  # A rung this proxy cannot RENDER on this target, which is the case the
  # capability report exists to make rare and can never make impossible: the
  # proxy learns what a target supports only by touching it. A destination named
  # by HOSTNAME cannot be rendered into a packet filter faithfully — a filter
  # resolves a name once, at insert time — so the session is an OUTAGE-class
  # denial naming the session id, and nothing is provisioned.
  - login: svc-deploy
    target: unrenderable.company.com
    proxy_id: proxy-direct
    route_type: direct
    resolved_target: target
    target_port: 22
    permissions: automationGroup
    permitted_channels: [session]
    permitted_requests:
      types: [exec]
      subsystems: []
    target_auth:
      method: ephemeral-user
      params:
        username: svc-deploy
        key_type: ed25519
    enforcement:
      execution: account-restricted
      reach: account-egress-restricted
      permitted_destinations:
        - host: artifacts.company.com
          port: 443
    filter_policy:
      mode: whitelist
      exec_mode: restricted
      restricted_exec:
        commands:
          - executable: uptime
            form: exact
            argv: []

  # Nothing else is routed. A target with no rule here is a 401, which is the
  # denial half of the disclosure rule (PLAN §4.3): fixtures say yes explicitly.

events:
  heartbeat_ms: 5000
  replay_buffer: 128

host_keys:
  # Trust-on-first-use (D7): the target's host key is generated per container
  # start, so there is nothing to pre-seed.
  decision: accept
