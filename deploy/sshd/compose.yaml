# One target host with a real sshd, for `make test-sshd`. See Dockerfile for
# what it provides and why. Phase 0012 owns the full e2e topology; this is the
# single container phase 0007's credential methods need.
services:
  target:
    build:
      context: .
    ports:
      - "${HOPLOCK_SSHD_PORT:-2022}:22"
