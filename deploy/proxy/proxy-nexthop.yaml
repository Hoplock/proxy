# proxy-nexthop: the edge proxy that reaches the target ONLY by chaining. It is
# not on the `core` network at all, so a session that arrived at the target
# through here provably travelled through a second proxy. It is also the relay
# hub: proxy-zone registers with it (D11).
#
# See config.example.yaml for what every field means.

proxy:
  id: "proxy-nexthop"
  listen_addr: "0.0.0.0:2222"
  host_key_path: "/material/hostkey_proxy_nexthop"

control:
  base_url: "http://control:8080"
  token: "e2e-proxy-token"
  cache:
    max_ttl: 0s
    stale_after: 30s

dial:
  dial_timeout: 15s
  default_target_port: 22

logging:
  # The resilience buffer is what the outage scenario asserts on: with control
  # stopped, records land here and drain in order when it returns (D8).
  buffer_dir: "/var/lib/hoplock/logbuf"
  batch_size: 8
  flush_interval: 2s
  queue_size: 1024
  send_timeout: 5s
  retry_min: 500ms
  retry_max: 5s
  max_payload_bytes: 32768

routing:
  target_delimiter: "#"

chain:
  identity_key_path: "/material/chain_proxy_nexthop"
  max_hops: 4
  # Accept relay registrations from the proxies below this one. This is NOT the
  # SSH listener above: users never reach it, only proxies do. The comment on
  # each authorized key is the proxy id that key may register as.
  accept:
    listen_addr: "0.0.0.0:2223"
    authorized_keys_path: "/material/relay_authorized_keys"
    keepalive_interval: 5s

auth:
  user:
    # Certificate only. There is no password/MFA scenario in this topology, and
    # offering a method no fixture can satisfy would just prompt for a secret
    # that can never work.
    methods: ["cert"]
  target:
    # The FALLBACK only: every route in the fixtures names its own target_auth,
    # which is the server's choice per route (D6a). Both production methods are
    # configured below because this one proxy fronts both estates.
    method: "brokered-key"
    ephemeral_user:
      management_key_path: "/material/management_key"
      provisioning_user: "root"
      shell: "sh -c"
      home_base: "/home"
      target_shell: "/bin/sh"
      key_expiry: true
      timeout: 30s
      reaper:
        interval: 1m
        grace: 5m
    brokered_key:
      source: "dir"
      username: "netadmin"
      dir: "/material/brokered"
      file_suffix: ".key"
