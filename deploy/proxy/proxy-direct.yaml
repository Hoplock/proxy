# proxy-direct: the edge proxy that reaches the target itself, and the far end
# of the `dial` chain. See config.example.yaml for what every field means.

proxy:
  id: "proxy-direct"
  listen_addr: "0.0.0.0:2222"
  host_key_path: "/material/hostkey_proxy_direct"

control:
  base_url: "http://control:8080"
  token: "e2e-proxy-token"
  cache:
    max_ttl: 0s
    stale_after: 30s

dial:
  dial_timeout: 15s
  default_target_port: 22

logging:
  # The resilience buffer is what the outage scenario asserts on: with control
  # stopped, records land here and drain in order when it returns (D8).
  buffer_dir: "/var/lib/hoplock/logbuf"
  batch_size: 8
  flush_interval: 2s
  queue_size: 1024
  send_timeout: 5s
  retry_min: 500ms
  retry_max: 5s
  max_payload_bytes: 32768

routing:
  target_delimiter: "#"

chain:
  identity_key_path: "/material/chain_proxy_direct"
  max_hops: 4

auth:
  user:
    # Certificate only. There is no password/MFA scenario in this topology, and
    # offering a method no fixture can satisfy would just prompt for a secret
    # that can never work.
    methods: ["cert"]
  target:
    # The FALLBACK only: every route in the fixtures names its own target_auth,
    # which is the server's choice per route (D6a). Both production methods are
    # configured below because this one proxy fronts both estates.
    method: "brokered-key"
    ephemeral_user:
      management_key_path: "/material/management_key"
      provisioning_user: "root"
      shell: "sh -c"
      home_base: "/home"
      target_shell: "/bin/sh"
      key_expiry: true
      timeout: 30s
      reaper:
        interval: 1m
        grace: 5m
    brokered_key:
      source: "dir"
      username: "netadmin"
      dir: "/material/brokered"
      file_suffix: ".key"
    # The third estate this one proxy fronts: appliances that cannot create an
    # OS user at all (D13). The `device` node stands in for one.
    ephemeral_account:
      admin_user: "hoplock-mgmt"
      password_env: "HOPLOCK_DEVICE_ADMIN_PASSWORD"
      platforms: ["fortigate"]
      # Named rather than left empty, because since phase 0015 there is no
      # driver default to leave it at: no FortiOS built-in is a safe default, so
      # the operator picks. Phase 0017 is what turns this into policy.
      access_profile: "super_admin_readonly"
      # Tight, because on FortiOS nothing but this sweep ever removes an
      # account: the platform can deny an administrator's login on a schedule
      # but never deletes one, and this driver does not render even that
      # (phase 0015; the schedule mechanism is phase 0028).
      reaper:
        interval: 1m
        grace: 5m
