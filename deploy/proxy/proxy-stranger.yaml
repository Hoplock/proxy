# proxy-stranger: a proxy the fleet does not recognise as one of its own
# (phase 0033).
#
# Everything about it is ordinary except one thing: the chain identity below is
# generated by deploy/gen-material.sh and its fingerprint is DELIBERATELY not in
# the `proxies:` list the mock Hoplock Control is given. So a user authenticates
# to this proxy normally — its host key and the user's own key are both known —
# and then the next hop it dials refuses the key IT presents.
#
# That is the fault the scenarios are evidence about: a chain key rotated on one
# proxy and never registered, or a proxy brought up before anybody added it. The
# next proxy is reachable, it answers, and it refuses us — which is the trust
# model working (docs/PLAN.md §6.1), and which this proxy used to report as an
# unreachable proxy.
#
# It is on `edge` only. It reaches no target of its own: `stranger.company.com`
# is its one route and it is a chain route, so nothing here can be served
# locally. See config.example.yaml for what every field means.

proxy:
  id: "proxy-stranger"
  listen_addr: "0.0.0.0:2222"
  host_key_path: "/material/hostkey_proxy_stranger"

control:
  base_url: "http://control:8080"
  token: "e2e-proxy-token"
  cache:
    max_ttl: 0s
    stale_after: 30s

dial:
  dial_timeout: 15s
  default_target_port: 22

logging:
  buffer_dir: "/var/lib/hoplock/logbuf"
  batch_size: 8
  flush_interval: 2s
  queue_size: 1024
  send_timeout: 5s
  retry_min: 500ms
  retry_max: 5s
  max_payload_bytes: 32768

routing:
  target_delimiter: "#"

chain:
  # The unregistered key. Nothing registers it; see gen-material.sh.
  identity_key_path: "/material/chain_proxy_stranger"
  max_hops: 4

auth:
  user:
    # Certificate only, like every proxy but proxy-direct: the fallback ORDER
    # (docs/PLAN.md §4.1) is only observable while proxies exist that give a
    # client with no acceptable key no second chance.
    methods: ["cert"]
  target:
    # The fallback only, and unreachable here: this proxy's one route is a chain
    # route, so no target credential is ever provisioned. It is configured
    # because the method needs a value, not because anything uses it.
    method: "brokered-key"
    brokered_key:
      source: "dir"
      username: "netadmin"
      dir: "/material/brokered"
      file_suffix: ".key"
