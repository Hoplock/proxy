# Example fixtures for the mock Hoplock Control (cmd/mock-control).
#
# Everything the mock decides comes from this file: who exists, what they may
# reach, and how target host keys are treated. The format is documented in
# api/README.md. Unknown keys are rejected at startup.
#
# The credentials below are test data. Never put a real secret in a fixture.

# Bearer token every /v1 request must present. Remove or leave empty to serve
# without proxy authentication (convenient for curl during development).
proxy_token: "dev-proxy-token"

users:
  # Certificate + password user whose MFA is approved after one pending poll.
  - login: alice
    identity:
      subject: alice@example.com
      display_name: Alice Example
      source: fixture
      principals: [alice]
      groups: [engineering, sre]
      claims:
        department: platform
    key_fingerprints:
      - "SHA256:AAAA1111alice1111AAAA1111alice1111AAAA111111"
    password: "alice-dev-password"
    mfa:
      required: true
      decision: approve
      pending_polls: 1
      poll_after_ms: 10
      ttl_ms: 60000
      prompt: "Approve the Hoplock Proxy sign-in on your phone."

  # Password-only user whose MFA is always denied — the deny path for tests.
  - login: mallory
    identity:
      subject: mallory@example.com
      source: fixture
    password: "mallory-dev-password"
    mfa:
      required: true
      decision: deny
      pending_polls: 0

  # Key-only service account with no MFA and no password.
  - login: svc-deploy
    identity:
      subject: svc-deploy@example.com
      source: fixture
      groups: [deployers]
    key_fingerprints:
      - "SHA256:BBBB2222svc2222BBBB2222svc2222BBBB22222222"

# The fleet's own proxies, recognised by the key one presents when it extends a
# chain to the next (D11). A chain leg authenticates the PREVIOUS HOP; the
# identity the server answers with is still the user's, established here rather
# than asserted by the upstream proxy — no hop takes another hop's word for who
# is connecting (docs/PLAN.md §6.1).
proxies:
  - id: proxy-1
    key_fingerprints:
      - "SHA256:CCCC3333proxy1CCCC3333proxy1CCCC3333proxy1"
  - id: proxy-2
    key_fingerprints:
      - "SHA256:DDDD4444proxy2DDDD4444proxy2DDDD4444proxy2"

routes:
  # Direct route: alice reaches this host read-only, under a blacklist whose
  # rules each carry their own severity — kill, block, and warn in one policy.
  - login: alice
    target: host.company.com
    route_type: direct
    target_port: 22
    permissions: readOnlyGroup
    permitted_channels: [session]
    filter_policy:
      # Rules are evaluated in order, first match wins, and each carries its own
      # action — so one policy can warn on one command and kill on another.
      mode: blacklist
      rules:
        - match: "rm -rf /"
          action: kill_session
          message: "Destructive command. This session has been terminated."
        - match: "shutdown"
          action: block_command
          message: "Reboots go through the change process."
        - match: "sudo *"
          action: warn_and_continue
          message: "Privileged command — this is recorded."
    # Axis 2 of the policy vocabulary (D5a): which requests may be made INSIDE
    # a permitted channel. `session` carries scp, sftp, a shell, and a one-shot
    # command alike, so the channel allow-list above cannot say "may log in,
    # may not copy files off the box" — this can. Subsystems are named
    # individually, so sftp is denied here while shell stays.
    #
    # Omitting `permitted_requests` entirely leaves requests unpoliced (what a
    # v1 server means). Writing `permitted_requests: {}` denies every one.
    permitted_requests:
      types: [pty-req, shell, exec, env]
      subsystems: []
    # Axis 3: connection-level global requests. Remote forwarding is asked for
    # with `tcpip-forward` on the connection, not by opening a channel, so the
    # channel allow-list never sees it. An empty `types` denies every one,
    # which is what "may never open a listener" looks like.
    permitted_global_requests:
      types: []
    # The credential method for this route is the server's choice, not the
    # proxy's config (D6a). Linux hosts that accept a provisioning account get
    # just-in-time users.
    target_auth:
      method: ephemeral-user
      params:
        # Required since contract v3 on every provisioning method. It used to
        # default to the identity's login, and a login is a client-typed string
        # that must never name an account on a target.
        username: alice
        key_type: ed25519
        lifetime_seconds: "900"
    # The server authorises the proxy to reuse this decision for a minute, so
    # a second session (an scp beside a shell) skips the authorize round trip.
    # Omit `cache` — as every other route here does — to forbid reuse entirely.
    # The key defaults to one per (subject, target) and is opaque to the
    # proxy; it is what a cache_invalidate event names.
    cache:
      ttl_seconds: 60

  # Next-hop route: the far segment is reachable only through another proxy.
  # The response returns next_hop as the target and carries the host the user
  # asked for in hop metadata.
  #
  # `proxy_id` is what makes this a chain rather than a loop: the rule applies
  # only when proxy-1 asks. The rule below it answers the SAME login and target
  # for proxy-2, which is the far end and routes directly. Each hop calls
  # authorize for itself and gets the answer that belongs to where it sits.
  - login: alice
    target: deep.internal.company.com
    proxy_id: proxy-1
    route_type: nexthop
    next_hop: proxy-2.company.com
    max_hops: 3
    # How the next proxy is reached (D11). `relay` means proxy-2 has already
    # registered an OUTBOUND connection with this proxy, which then opens a
    # channel over it — the protected zone needs no inbound firewall rule at
    # all. `next_proxy_id` is how that registration is selected. Omitting
    # `hop_connection` means `dial`, the original behaviour, which does need an
    # inbound rule. A relay hop with no live registration is an outage; it is
    # never quietly downgraded to a dial.
    hop_connection: relay
    next_proxy_id: proxy-2
    permissions: readOnlyGroup
    permitted_channels: [session]
    filter_policy:
      # No rules on a blacklist means no filtering.
      mode: blacklist

  # The far end of that chain: the same user and the same target, answered for
  # the proxy inside the protected zone, which can reach the host itself.
  - login: alice
    target: deep.internal.company.com
    proxy_id: proxy-2
    route_type: direct
    permissions: readOnlyGroup
    permitted_channels: [session]
    filter_policy:
      mode: blacklist

  # An appliance the proxy cannot administer, under RESTRICTED EXEC (D12): the
  # command is parsed into an argument vector and must be covered completely by
  # one entry below, or it is denied. Nothing else runs, and nothing is passed
  # through a shell to be re-expanded.
  #
  # `exec_mode: restricted` and a `rules` list are ALTERNATIVES, not layers — a
  # route setting both is a contract violation and the mock refuses to start.
  - login: svc-deploy
    target: edge-fw-01.company.com
    route_type: direct
    permissions: applianceReadOnly
    permitted_channels: [session]
    permitted_requests:
      types: [exec]
    target_auth:
      method: brokered-key
      params:
        username: monitor
        credential_ref: edge-fleet-2026
    # An ATTESTED rung on a brokered-key route (contract v4). The proxy
    # administers nothing here — that is what brokered-key means — so no
    # APPLIED rung is available and naming one would be a contract violation
    # the mock refuses at startup. What IS available is the boundary the
    # network team already configured on the device, and saying "none
    # available" about it would be false. The proxy configures nothing,
    # verifies nothing, and records who says so.
    enforcement:
      execution: platform-attested
      reach: platform-attested
      attestation:
        asserted_by: network-engineering
        reference: "NET-BASELINE-7.2 §4 (edge firewall RBAC + per-account ACL)"
        asserted_at: "2026-07-01T00:00:00Z"
    filter_policy:
      # With an empty rule list, `whitelist` also blocks every command typed
      # into an interactive shell — which this route has no channel for anyway.
      mode: whitelist
      exec_mode: restricted
      restricted_exec:
        commands:
          # form: exact — the whole argument vector, compared element by
          # element. Nothing longer and nothing shorter matches.
          - executable: /bin/uptime
            form: exact
            argv: []
          - executable: show
            form: exact
            argv: [version]
          # form: positional — one spec per argument position. Arguments beyond
          # the last spec are DENIED: there is no trailing wildcard.
          - executable: /usr/bin/journalctl
            form: positional
            args:
              - kind: prefix
                value: "--unit="
              - kind: oneof
                values: ["-n", "--lines"]
                optional: true
              - kind: any
                # `any` is named rather than smuggled in as an empty prefix, so
                # that every unconstrained position is visible to a reviewer
                # searching for the word. It is the one shape here that is not
                # a boundary.
                optional: true

  # A DEVICE, reached with the contract v3 credential ladder (D14). The server
  # authors the degradation and the proxy never invents it: a short-lived
  # administrator created through the `fortios` driver first, and the standing
  # brokered credential only if that rung cannot be satisfied — a driver this
  # build does not carry, a device that will not enforce expiry.
  #
  # `target_auth_ladder` and `target_auth` are ALTERNATIVES, not layers: a route
  # setting both is a contract violation and the mock refuses to start.
  #
  # `algorithm_profile` is why this route connects at all. The firmware speaks
  # nothing a modern default enables, and the profile is named here, per route,
  # rather than by a proxy-wide knob that would weaken every leg in the fleet.
  - login: svc-deploy
    target: core-fw-01.company.com
    route_type: direct
    permissions: applianceAdmin
    permitted_channels: [session]
    permitted_requests:
      types: [exec]
    algorithm_profile: legacy-device
    target_auth_ladder:
      - method: ephemeral-account
        params:
          username: hoplock
          # Which driver. Never inferred from a banner: guessing wrong means
          # running configuration commands against the wrong parser.
          platform: fortios
          credential_kind: publickey
          # The device expires the account itself, so it dies whether or not
          # this proxy lives to remove it. A driver that cannot do that makes
          # this rung unsatisfiable and the proxy walks to the next one.
          expiry_posture: target-enforced
          lifetime_seconds: "900"
      - method: brokered-key
        params:
          username: netadmin
          credential_ref: core-fleet-2026
    # The device's own command authorizer decides, for the administrator this
    # session creates, under the role named here — ahead of anything the proxy
    # could parse, and effective against a connection that never went through a
    # proxy. `platform_role` is the route's to name: FortiOS documents three
    # built-in profiles, `super_admin_readonly` cannot run `diagnose` from
    # 7.4.x, and no built-in read-only profile can be held by a VDOM-scoped
    # account at all — so there is no default to fall back on (PLAN §5.3).
    #
    # This is an APPLIED rung, and it is legal here because the FIRST ladder
    # entry provisions the target. The brokered-key entry below it cannot carry
    # it, and that entry is therefore a SKIPPED rung (D14) rather than a
    # session that quietly runs without the rung its record claims.
    enforcement:
      execution: platform-authorized
      platform_role: prof_admin
    filter_policy:
      mode: whitelist
      rules:
        - match: "get system status"
          action: allow_and_log

  # The same vocabulary saying the OPPOSITE thing: a ONE-ENTRY ladder is how a
  # policy refuses degradation. If the device cannot give this session its own
  # administrator, there is no session — which is exactly what a single
  # `target_auth` object meant before v3.
  - login: svc-deploy
    target: crown-fw-01.company.com
    route_type: direct
    permissions: applianceAdmin
    permitted_channels: [session]
    permitted_requests:
      types: [exec]
    algorithm_profile: legacy-rsa-sha1
    target_auth_ladder:
      - method: ephemeral-account
        params:
          username: hoplock
          platform: fortios
          credential_kind: password
          # Nobody enforces expiry here and the policy says so out loud, rather
          # than reaching it by leaving the field out. `lifetime_seconds` is
          # required under every other posture.
          expiry_posture: accepted-risk
    filter_policy:
      mode: whitelist
      rules:
        - match: "get system status"
          action: allow_and_log

  # ENFORCEMENT POINTS, axis 1 (contract v4, PLAN §6.5). The cheapest strong
  # rung in the whole table, and it is already shipped: this route permits
  # `exec` and not `shell` or `pty-req`, so the session can never obtain a
  # terminal and EVERY command it runs is one the proxy decided. That turns the
  # filter from "a boundary for the commands it sees" into a boundary.
  #
  # The claim and the policy have to agree: a route naming this rung while
  # `permitted_requests` permits `shell` or `pty-req` — or omitting
  # `permitted_requests`, which polices nothing — is a contract violation and
  # the mock refuses to start.
  - login: svc-deploy
    target: automation-01.company.com
    route_type: direct
    permissions: automationGroup
    permitted_channels: [session]
    permitted_requests:
      types: [exec]
    target_auth:
      method: ephemeral-user
      params:
        username: svc-automation
        key_type: ed25519
        lifetime_seconds: "300"
    enforcement:
      execution: no-interactive-shell
      # `reach` is omitted, so it takes its default: SSH-channel forwarding is
      # policed and a process this session starts on the target still opens its
      # own sockets. The two axes are independent, and leaving one alone is a
      # decision the policy is allowed to make.
    # UC2: one automation host runs several automations, and a ceiling on live
    # sessions is knowable only to the proxy, which holds the session registry.
    # Exceeding it is a policy denial, not an outage.
    concurrency:
      max_sessions_per_subject: 4
      max_sessions_per_target: 10
    filter_policy:
      mode: whitelist
      rules:
        - match: "deploy status"
          action: allow_and_log

  # ENFORCEMENT POINTS, both axes, rendered onto the ACCOUNT the proxy creates.
  # `account-restricted` needs `exec_mode: restricted`, because `restricted_exec`
  # is the only place the contract names an executable and a pattern rule list
  # has nothing to render. `account-egress-restricted` needs its destinations:
  # they are the whole content of the rung.
  #
  # `enforcement.permitted_destinations` reuses `permitted_forwards`' entry
  # shape and shares NONE of its meaning. permitted_forwards is a rule about
  # SSH channels the proxy sees; this is a rule about sockets the target's
  # kernel sees. A console that answered "can this account reach the database?"
  # from the first would be answering a different question.
  - login: svc-deploy
    target: build-01.company.com
    route_type: direct
    permissions: buildGroup
    permitted_channels: [session]
    permitted_requests:
      types: [exec]
    target_auth:
      method: ephemeral-user
      params:
        username: svc-build
        key_type: ed25519
        lifetime_seconds: "900"
    enforcement:
      execution: account-restricted
      reach: account-egress-restricted
      permitted_destinations:
        - host: artifacts.company.com
          port: 443
        - host: 10.9.0.0/16
          port_range:
            from: 8080
            to: 8090
    filter_policy:
      mode: whitelist
      exec_mode: restricted
      restricted_exec:
        commands:
          - executable: /usr/bin/make
            form: positional
            args:
              - kind: oneof
                values: [build, test]
          - executable: /bin/uptime
            form: exact
            argv: []

  # The strongest pair of applied rungs. `account-confined` adds what an
  # executable allow-list cannot do on its own — the session cannot gain
  # privilege and cannot execute anything it wrote — and
  # `account-network-isolated` gives its processes loopback and nothing else.
  # A sensor that reads local state and reports through the session needs
  # neither the network nor a binary of its own.
  - login: svc-deploy
    target: sensor-01.company.com
    route_type: direct
    permissions: sensorGroup
    permitted_channels: [session]
    permitted_requests:
      types: [exec]
    target_auth:
      method: ephemeral-user
      params:
        username: svc-sensor
        key_type: ed25519
        lifetime_seconds: "300"
    enforcement:
      execution: account-confined
      reach: account-network-isolated
    filter_policy:
      mode: whitelist
      exec_mode: restricted
      restricted_exec:
        commands:
          - executable: /usr/bin/sensor-report
            form: exact
            argv: []

  # UC3 (PLAN §13): a scanner needs root and changes its command set with every
  # content update, so EVERY rung of the execution ladder is worthless against
  # it by construction — there is no argv shape to name. The honest claim is
  # just-in-time, scoped, and recorded, never filtered, and this route says
  # exactly that: the enforcement object is absent, and what bounds the access
  # is time, scope, and a recording outside the target's reach (D16).
  #
  # `session_deadline_seconds` is a fixture convenience: the wire field is an
  # ABSOLUTE INSTANT, anchored by the server at authorize time, because a
  # duration re-anchors on every hop of a chained route and silently multiplies
  # the window.
  - login: alice
    target: scan-target-01.company.com
    route_type: direct
    permissions: scannerGrant
    permitted_channels: [session]
    permitted_requests:
      types: [pty-req, shell, exec]
    target_auth:
      method: ephemeral-user
      params:
        username: svc-scan
        key_type: ed25519
        lifetime_seconds: "3600"
    # Enforced by the PROXY, locally, so it holds when the revocation stream is
    # down — which is exactly when an immortal root session is least
    # acceptable, and the reason this is not "just use revocation".
    session_deadline_seconds: 3600
    # The compensating control that makes an unbounded-privilege grant
    # defensible: root on a target can disable that target's auditing and scrub
    # its traces; it cannot touch a session captured in the proxy. A proxy with
    # no recording path AT ALL refuses this route — buffering to local disk
    # counts, so the refusal is rare and means what it says.
    require_session_capture: true
    # Why the access was granted. The proxy copies all of it to every log
    # record for the session and reads NONE of it: it is never parsed, never
    # matched against, and never the basis of a proxy-side decision. The
    # decision it describes was already made upstream, by the PDP (D2, D15).
    grant_context:
      system: qualys
      reference: SCAN-2026-09-04-1183
      window_start: "2026-09-04T09:00:00Z"
      window_end: "2026-09-04T17:00:00Z"
      additional_context_fields:
        scan_profile: authenticated-linux
        requested_by: soc-oncall
    concurrency:
      max_sessions_per_target: 1
    filter_policy:
      # A blacklist with no rules filters nothing, which is the honest shape
      # for this route: see above.
      mode: blacklist

  # Whitelist: anything not matched by a rule is blocked by the mode. Port
  # forwarding is permitted for the deploy account — but only to one place.
  - login: svc-deploy
    target: "*"
    route_type: direct
    permissions: deployGroup
    permitted_channels: [session, direct-tcpip]
    permitted_requests:
      # A CI account runs commands and never needs a terminal, so `pty-req` and
      # `shell` are simply absent: anything a present policy does not name is
      # denied.
      types: [exec, env]
    # Axis 2 again, for the other kind of channel: a `direct-tcpip` open
    # carries the host and port it wants, and THAT is what policy is about.
    # Allowing the channel type alone would permit tunnelling anywhere.
    permitted_forwards:
      direct_tcpip:
        - host: postgres.prod.company.com
          port: 5432
        # Wildcards match leading labels; a CIDR matches only IP literals, and
        # the proxy never resolves a name to decide policy.
        - host: "*.metrics.company.com"
          port_range:
            from: 9090
            to: 9100
        - host: 10.4.0.0/16
          port: 443
      # The target may not open forwards back at all: the list is empty, and an
      # empty list in a present policy is a deny.
      forwarded_tcpip: []
    target_auth:
      method: brokered-key
      params:
        username: svc-deploy
        # An opaque handle naming material the proxy holds locally. No
        # credential travels on this API.
        credential_ref: deploy-fleet-2026
    filter_policy:
      # Whitelist: anything no rule matched is blocked. These two are allowed,
      # and reaching for the one dangerous neighbour kills the session outright.
      mode: whitelist
      rules:
        - match: "deploy"
          action: allow_and_log
        - match: "systemctl restart app"
          action: allow_and_log
        - match: "systemctl stop *"
          action: kill_session
          message: "Stopping services is not permitted from this account."

  # Anything not matched above is denied (401). There is no catch-all here on
  # purpose: fixtures should have to say yes explicitly.

# The server → proxy revocation stream (GET /v1/proxies/{id}/events), which
# is what makes the cache above safe to hold: it can kill a live session or drop
# a cached decision at any moment.
events:
  # How often to emit a heartbeat. It must stay comfortably inside the proxy's
  # heartbeat timeout (20s by default), or a healthy stream looks dead. A
  # negative value disables heartbeats, to exercise that detection.
  heartbeat_ms: 5000
  # How many events are retained for replay after a reconnect. A proxy
  # resuming from before the retained history is answered with `resync`.
  replay_buffer: 128

host_keys:
  # Decision applied to a host key the server has not seen before. "accept" is
  # the prototype's trust-on-first-use behaviour (D7); "reject" exercises the
  # stricter path.
  decision: accept
  known:
    - target: host.company.com
      fingerprint: "SHA256:CCCC3333hostkey3333CCCC3333hostkey3333CCCC"
